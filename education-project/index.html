标、范围和主要内容">${esc(p?.description||'')}</textarea><div class="field-error">请输入建设内容</div></div></div></div><div class="form-section"><div class="form-title">关联场地</div><div class="field" data-field="sites"><label class="required">本校场地（至少选择 1 个，支持多选）</label><div class="site-picker">${allowedSites.map(s=>`<label class="site-option"><input type="checkbox" name="sites" value="${s.id}" ${p?.sites.includes(s.id)?'checked':''}><b>${s.name}</b><span>${s.campus}</span></label>`).join('')}</div><div class="field-error">至少选择一个本校场地</div></div></div><div class="form-section"><div class="form-title">项目附件</div><div class="upload-zone" id="uploadZone"><i class="ri-upload-cloud-2-line"></i><div><b>点击补充演示附件</b></div><small>支持 PDF、Word、Excel、图片；演示文件不上传服务器</small></div><div id="fileList">${(p?.files||[]).map(f=>fileRow(f)).join('')}</div></div><div class="notice"><i class="ri-git-commit-line"></i><div>提交路径：申请人提交 → ${store.settings.schoolEnabled?'学校内部审批 → ':''}${store.settings.bureauEnabled?'教育局内部审批':'直接进入会议记录阶段'}。流程配置将在提交时生成版本快照。</div></div></div><div class="form-foot"><button type="button" class="btn" id="saveDraft">保存草稿</button><button type="submit" class="btn primary"><i class="ri-send-plane-line"></i>${p?.status==='RETURNED'?'重新提交':'提交申请'}</button></div></form>`}
    function fileRow(f){return `<div class="file-row"><i class="ri-file-pdf-2-line"></i><b>${esc(f)}</b><span>已就绪</span><button type="button" class="btn link" data-remove-file="${esc(f)}">删除</button></div>`}
    function sitesPage(){const rows=store.sites.filter(s=>s.school==='海淀区实验中学');return pageHead('学校场地档案查看','教育局仅查看学校维护的场地基础数据，不提供修改入口')+`<div class="notice"><i class="ri-eye-line"></i><div>场地档案由学校维护，教育局端为只读；项目关联场地后不可删除，只能停用。</div></div><div class="card"><div class="table-wrap"><table><thead><tr><th>场地名称</th><th>学校</th><th>校区</th><th>状态</th><th>项目引用数</th><th>操作</th></tr></thead><tbody>${rows.map(s=>`<tr><td><b>${s.name}</b></td><td>${s.school}</td><td>${s.campus}</td><td><span class="tag green">${s.status}</span></td><td>${store.projects.filter(p=>p.sites.includes(s.id)).length}</td><td><button class="btn link">查看档案</button></td></tr>`).join('')}</tbody></table></div></div>`}
    function typesPage(){return pageHead('项目类型配置','学校只能选择教育局当前启用的项目类型',`<button class="btn primary" id="addType"><i class="ri-add-line"></i>新增类型</button>`)+`<div class="card"><div class="table-wrap"><table><thead><tr><th>类型编码</th><th>项目类型</th><th>适用范围</th><th>状态</th><th>版本</th><th>操作</th></tr></thead><tbody>${store.types.map((t,i)=>`<tr><td>${t.id}</td><td><b>${t.name}</b></td><td>硬件建设项目</td><td><span class="tag ${t.enabled?'green':''}">${t.enabled?'已启用':'已停用'}</span></td><td>V${i+2}</td><td><button class="btn link" data-toggle-type="${t.id}">${t.enabled?'停用':'启用'}</button></td></tr>`).join('')}</tbody></table></div></div>`}
    function flowPage(){return pageHead('审批流程配置','配置开启状态与匹配规则；在途项目继续使用发起时的版本快照')+`<div class="grid-2"><div class="card"><div class="card-head"><h2>流程启停</h2><span class="tag blue">当前版本 V5</span></div><div class="card-body"><div class="rule"><div class="rule-index"><i class="ri-school-line"></i></div><div class="rule-copy"><b>学校内部审批</b><span>关闭后，学校申请人提交直接进入教育局端</span></div><button class="switch ${store.settings.schoolEnabled?'on':''}" data-setting="schoolEnabled" aria-label="切换学校内部审批"></button></div><div class="rule"><div class="rule-index"><i class="ri-government-line"></i></div><div class="rule-copy"><b>教育局内部审批</b><span>关闭后，学校提交直接进入会议记录阶段</span></div><button class="switch ${store.settings.bureauEnabled?'on':''}" data-setting="bureauEnabled" aria-label="切换教育局内部审批"></button></div><div class="rule"><div class="rule-index"><i class="ri-chat-check-line"></i></div><div class="rule-copy"><b>审批意见必填</b><span>所有通过、退回操作均校验审批意见</span></div><button class="switch ${store.settings.opinionRequired?'on':''}" data-setting="opinionRequired" aria-label="切换审批意见要求"></button></div></div></div><div class="card"><div class="card-head"><h2>流程匹配规则</h2><button class="btn small"><i class="ri-add-line"></i>新增规则</button></div><div class="card-body"><div class="rule"><div class="rule-index">1</div><div class="rule-copy"><b>设备购置 · 金额 &lt; 100 万元</b><span>业务科角色审批 · 或签 · 可退回申请人</span></div><span class="tag green">启用</span></div><div class="rule"><div class="rule-index">2</div><div class="rule-copy"><b>全部类型 · 金额 ≥ 100 万元</b><span>业务科或签 → 分管领导会签 · 可退回上一节点</span></div><span class="tag green">启用</span></div><div class="rule"><div class="rule-index">3</div><div class="rule-copy"><b>信息化建设 · 任意金额</b><span>指定人员审批 · 允许补充附件</span></div><span class="tag green">启用</span></div></div></div></div><div style="height:18px"></div><div class="notice warn"><i class="ri-history-line"></i><div><b>版本化规则：</b>修改并发布后生成新版本；已发起项目保留 V5 快照，不随新配置变化。</div></div>`}
    function statsPage(){return pageHead('项目审批统计','按项目类型、状态和审批结果统计管理范围内项目')+`<div class="kpis"><div class="kpi"><div class="kpi-icon"><i class="ri-file-list-3-line"></i></div><div><div class="kpi-label">项目总数</div><div class="kpi-value">${store.projects.length}</div></div></div><div class="kpi"><div class="kpi-icon"><i class="ri-money-cny-box-line"></i></div><div><div class="kpi-label">申报总金额</div><div class="kpi-value" style="font-size:24px">${(store.projects.reduce((n,p)=>n+p.amount,0)/10000).toFixed(1)}万</div></div></div><div class="kpi"><div class="kpi-icon"><i class="ri-checkbox-multiple-line"></i></div><div><div class="kpi-label">已通过</div><div class="kpi-value">${store.projects.filter(p=>p.status==='MEETING_PENDING').length}</div></div></div><div class="kpi"><div class="kpi-icon"><i class="ri-reply-line"></i></div><div><div class="kpi-label">已退回</div><div class="kpi-value">${store.projects.filter(p=>p.status==='RETURNED').length}</div></div></div></div><div class="grid-2"><div class="card"><div class="card-head"><h2>按项目类型统计</h2></div><div class="card-body"><div class="stat-bars">${store.types.map((t,i)=>{const n=store.projects.filter(p=>p.type===t.name).length;return `<div class="stat-row"><span>${t.name.replace('硬件建设-','')}</span><div class="bar"><span style="width:${Math.max(10,n/store.projects.length*100)}%;background:${['#1769e8','#08a66c','#7656df'][i]}"></span></div><b>${n} 项</b></div>`}).join('')}</div></div></div><div class="card"><div class="card-head"><h2>审批结果分布</h2></div><div class="card-body"><div class="stat-bars"><div class="stat-row"><span>审批中</span><div class="bar"><span style="width:50%"></span></div><b>${store.projects.filter(p=>['SCHOOL_PENDING','BUREAU_PENDING'].includes(p.status)).length}</b></div><div class="stat-row"><span>通过</span><div class="bar"><span style="width:35%;background:var(--green)"></span></div><b>${store.projects.filter(p=>p.status==='MEETING_PENDING').length}</b></div><div class="stat-row"><span>退回</span><div class="bar"><span style="width:25%;background:var(--red)"></span></div><b>${store.projects.filter(p=>p.status==='RETURNED').length}</b></div></div></div></div></div>`}
    function detailModal(id){const p=store.projects.find(x=>x.id===id);if(!p)return;const sites=p.sites.map(id=>store.sites.find(s=>s.id===id)).filter(Boolean);document.getElementById('modalRoot').innerHTML=`<div class="modal-mask"><div class="modal large"><div class="modal-head"><div><h2>${esc(p.name)}</h2><small>${p.id} · ${p.school} · ${statusMap[p.status][0]}</small></div><button class="close" data-close><i class="ri-close-line"></i></button></div><div class="modal-body"><div class="tabs"><button class="tab ${detailTab==='base'?'active':''}" data-detail-tab="base">项目概况</button><button class="tab ${detailTab==='trace'?'active':''}" data-detail-tab="trace">审批轨迹</button><button class="tab ${detailTab==='files'?'active':''}" data-detail-tab="files">项目附件</button><button class="tab ${detailTab==='snapshot'?'active':''}" data-detail-tab="snapshot">流程快照</button></div><div id="detailBody">${detailBody(p,sites)}</div></div><div class="modal-foot"><button class="btn" data-close>关闭</button>${actionFor(p).replaceAll('btn link','btn primary')}</div></div></div>`;bindModal();document.querySelectorAll('[data-detail-tab]').forEach(b=>b.onclick=()=>{detailTab=b.dataset.detailTab;detailModal(id)})}
    function detailBody(p,sites){if(detailTab==='trace')return `<div class="timeline">${p.trace.length?p.trace.map(t=>`<div class="timeline-item ${t.result==='待审批'?'pending':t.result.includes('退回')?'rejected':''}"><div class="timeline-top"><b>${t.node} · ${t.result}</b><span>${t.time}</span></div><p>处理人：${t.actor}${t.opinion?`<br>审批意见：${esc(t.opinion)}`:''}</p></div>`).join(''):'<div class="empty">草稿尚未生成审批轨迹</div>'}</div>`;if(detailTab==='files')return p.files.length?p.files.map(fileRow).join(''):`<div class="empty"><i class="ri-file-warning-line"></i>暂无项目附件</div>`;if(detailTab==='snapshot')return `<div class="notice"><i class="ri-camera-lens-line"></i><div><b>流程版本快照：${p.version}</b><br>快照在项目提交时固化；后续流程配置更新不影响当前项目。</div></div><div class="rule"><div class="rule-index">1</div><div class="rule-copy"><b>${store.settings.schoolEnabled?'学校内部审批 · 角色审批':'学校审批已跳过'}</b><span>或签 · 可退回申请人 · 意见${store.settings.opinionRequired?'必填':'选填'}</span></div></div><div class="rule"><div class="rule-index">2</div><div class="rule-copy"><b>${store.settings.bureauEnabled?'教育局业务科审批 · 角色审批':'教育局审批已跳过'}</b><span>类型和金额组合匹配 · 允许补充附件</span></div></div>`;return `<div class="detail-grid"><div class="detail-item"><label>所属学校</label>${p.school}</div><div class="detail-item"><label>创建人</label>${esc(p.applicant||'张老师')}</div><div class="detail-item"><label>项目类型</label>${p.type}</div><div class="detail-item"><label>申请金额</label><b>${money(p.amount)}</b></div><div class="detail-item"><label>当前状态</label>${statusTag(p.status)}</div><div class="detail-item"><label>创建时间</label>${p.created}</div><div class="detail-item"><label>更新时间</label>${p.updated}</div><div class="detail-item full"><label>建设内容</label>${esc(p.description)}</div><div class="detail-item full"><label>关联场地</label><div class="grid-2" style="margin-top:8px">${sites.map(s=>`<div class="card" style="padding:14px"><b style="display:block;margin-bottom:10px">${s.name}</b><div class="detail-grid"><div class="detail-item"><label>所属学校</label>${s.school}</div><div class="detail-item"><label>场地类型</label>${s.type||'—'}</div><div class="detail-item"><label>用途</label>${s.purpose||'—'}</div><div class="detail-item"><label>建设年份</label>${s.year||'—'}</div></div></div>`).join('')}</div></div></div>`}
    function approvalModal(id,level){const p=store.projects.find(x=>x.id===id),title=level==='school'?'学校内部审批':'教育局项目审批',currentNode=level==='school'?'学校内部审批（或签）':([...p.trace].reverse().find(t=>t.result==='待审批')?.node||pendingNode(p));document.getElementById('modalRoot').innerHTML=`<div class="modal-mask"><form class="modal" id="approvalForm"><div class="modal-head"><div><h2>${title}</h2><small>${p.name} · ${money(p.amount)}</small></div><button type="button" class="close" data-close><i class="ri-close-line"></i></button></div><div class="modal-body"><div class="notice"><i class="ri-shield-check-line"></i><div>当前节点：<b>${currentNode}</b><br>流程快照：${p.version}</div></div><div class="field"><label class="${store.settings.opinionRequired?'required':''}">审批意见</label><textarea class="textarea" name="opinion" rows="5" placeholder="${store.settings.opinionRequired?'请输入审批意见':'审批意见选填'}"></textarea><div class="field-help">退回申请人后，由学校修改并重新提交；教育局不能直接修改申请内容。</div></div><div class="form-section" style="margin-top:18px"><div class="form-title">补充附件</div><div class="upload-zone" id="approvalUpload"><i class="ri-attachment-2"></i><div>点击补充审批附件</div></div><div id="approvalFiles"></div></div></div><div class="modal-foot"><button type="button" class="btn" data-close>取消</button><button type="button" class="btn danger" id="returnApplicant"><i class="ri-corner-up-left-double-line"></i>退回申请人</button>${level==='bureau'?'<button type="button" class="btn" id="returnPrev">退回上一节点</button>':''}<button class="btn primary" type="submit"><i class="ri-check-line"></i>审批通过</button></div></form></div>`;bindModal();const form=document.getElementById('approvalForm'),getOpinion=()=>new FormData(form).get('opinion').trim(),validate=()=>{if(store.settings.opinionRequired&&!getOpinion()){toast('请填写审批意见',true);return false}return true};form.onsubmit=e=>{e.preventDefault();if(!validate())return;approve(p,level,getOpinion()||'同意。')};document.getElementById('returnApplicant').onclick=()=>{if(!validate())return;reject(p,level,getOpinion()||'请修改后重新提交。','申请人')};const prev=document.getElementById('returnPrev');if(prev)prev.onclick=()=>{if(!validate())return;reject(p,level,getOpinion()||'请上一节点复核。','上一节点')};document.getElementById('approvalUpload').onclick=()=>{const file=`${actor().role}补充附件-${p.files.length+1}.pdf`;p.files.push(file);save();document.getElementById('approvalFiles').insertAdjacentHTML('beforeend',fileRow(file));toast('审批附件已补充')}}
    function approve(p,level,opinion){p.updated=now();if(level==='school'){p.trace.push({node:'学校内部审批',actor:actor().name,result:'通过',time:p.updated,opinion});p.status=store.settings.bureauEnabled?'BUREAU_PENDING':'MEETING_PENDING';if(store.settings.bureauEnabled)p.trace.push({node:pendingNode(p),actor:'待处理',result:'待审批',time:'—',opinion:''})}else{const pending=p.trace.findLast(t=>t.result==='待审批'),node=pending?.node||pendingNode(p);if(pending){pending.actor=actor().name;pending.result='通过';pending.time=p.updated;pending.opinion=opinion}else p.trace.push({node,actor:actor().name,result:'通过',time:p.updated,opinion});if(p.amount>=1000000&&!node.includes('分管领导')){p.trace.push({node:'教育局分管领导会签',actor:'待处理',result:'待审批',time:'—',opinion:''});p.status='BUREAU_PENDING'}else p.status='MEETING_PENDING'}save();closeModal();toast(level==='school'?(p.status==='BUREAU_PENDING'?'学校审批通过，已进入教育局端':'学校审批通过，已进入会议记录阶段'):p.status==='BUREAU_PENDING'?'业务科审批通过，等待分管领导会签':'教育局审批通过，已进入会议记录阶段');render()}
    function reject(p,level,opinion,target){p.updated=now();const pending=p.trace.findLast(t=>t.result==='待审批'),node=level==='school'?'学校内部审批':pending?.node||pendingNode(p);if(pending&&level==='bureau')p.trace.splice(p.trace.indexOf(pending),1);p.trace.push({node,actor:actor().name,result:`退回${target}`,time:p.updated,opinion});if(target==='申请人')p.status='RETURNED';else if(node.includes('分管领导')){p.status='BUREAU_PENDING';p.trace.push({node:pendingNode(p),actor:'待处理',result:'待审批',time:'—',opinion:''})}else p.status='SCHOOL_PENDING';save();closeModal();toast(`项目已退回${target}`);render()}
    function guideModal(){document.getElementById('modalRoot').innerHTML=`<div class="modal-mask"><div class="modal large"><div class="modal-head"><div><h2>第二阶段完整流程演示</h2><small>建议按顺序完成学校发起与教育局审批</small></div><button class="close" data-close><i class="ri-close-line"></i></button></div><div class="modal-body"><div class="guide-steps"><div class="guide-step"><b>01 学校申请人</b><span>学校端 → 项目管理 → 新增项目 → 选择本校场地并提交。</span></div><div class="guide-step"><b>02 学校审批人</b><span>切换李主任 → 项目管理 → 项目审批 → 填写意见并通过。</span></div><div class="guide-step"><b>03 教育局审批人</b><span>切换教育局端与王科长 → 待审批项目 → 审批通过或退回。</span></div><div class="guide-step"><b>04 核对结果</b><span>项目详情 → 审批轨迹，核对留痕、附件与流程版本快照。</span></div></div><div class="notice success" style="margin:18px 0 0"><i class="ri-lightbulb-flash-line"></i><div>可在“审批流程配置”关闭校内或教育局审批，验证直达路径。重置演示数据可恢复初始状态。</div></div></div><div class="modal-foot"><button class="btn" data-close>关闭</button><button class="btn primary" id="startGuide"><i class="ri-play-line"></i>从学校新增项目开始</button></div></div></div>`;bindModal();document.getElementById('startGuide').onclick=()=>{switchPortal('school','applicant');page='new';closeModal();render();toast('第 1 步：填写并提交学校项目申请')}}
    function bindModal(){document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal);document.querySelectorAll('[data-approve-school]').forEach(b=>b.onclick=()=>approvalModal(b.dataset.approveSchool,'school'));document.querySelectorAll('[data-approve-bureau]').forEach(b=>b.onclick=()=>approvalModal(b.dataset.approveBureau,'bureau'))}

    function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{page=b.dataset.go;render()});document.querySelectorAll('[data-establishment-tab]').forEach(b=>b.onclick=()=>{establishmentTab=b.dataset.establishmentTab;render()});const returnWorkbench=document.getElementById('returnWorkbench');if(returnWorkbench)returnWorkbench.onclick=()=>{if(window.parent!==window)window.parent.postMessage({type:'project-back',portal},'*');else window.location.href='../docs/education-management-frontend.html?portal='+portal};document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>detailModal(b.dataset.detail));document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{page='edit:'+b.dataset.edit;render()});document.querySelectorAll('[data-approve-school]').forEach(b=>b.onclick=()=>approvalModal(b.dataset.approveSchool,'school'));document.querySelectorAll('[data-approve-bureau]').forEach(b=>b.onclick=()=>approvalModal(b.dataset.approveBureau,'bureau'));const guide=document.getElementById('guideNav'),inline=document.getElementById('guideInline');if(guide)guide.onclick=guideModal;if(inline)inline.onclick=guideModal;const search=document.getElementById('tableSearch'),filter=document.getElementById('statusFilter');if(search){const run=()=>{let r=page==='establishment'?establishmentRows():scoped();const keyword=search.value.toLowerCase();r=r.filter(p=>(p.name+p.id+(p.applicant||'')+(portal==='bureau'?p.school:'')).toLowerCase().includes(keyword)&&(!filter.value||p.status===filter.value));if(page==='drafts')r=r.filter(p=>p.status==='DRAFT');if(page==='schoolPending')r=r.filter(p=>p.status==='SCHOOL_PENDING');if(page==='bureauPending')r=r.filter(p=>p.status==='BUREAU_PENDING');document.getElementById('tableHost').innerHTML=projectTable(r);bind()};search.oninput=run;filter.onchange=run}document.querySelectorAll('[data-setting]').forEach(b=>b.onclick=()=>{const k=b.dataset.setting;store.settings[k]=!store.settings[k];save();toast('流程设置已更新，新提交项目将使用新快照');render()});document.querySelectorAll('[data-toggle-type]').forEach(b=>b.onclick=()=>{const t=store.types.find(x=>x.id===b.dataset.toggleType);t.enabled=!t.enabled;save();toast(`项目类型已${t.enabled?'启用':'停用'}`);render()});const form=document.getElementById('projectForm');if(form)bindForm(form);document.querySelectorAll('[data-remove-file]').forEach(b=>b.onclick=()=>b.closest('.file-row').remove())}
    function bindForm(form){const editId=page.startsWith('edit:')?page.split(':')[1]:null,p=editId?store.projects.find(x=>x.id===editId):null;let files=[...(p?.files||[])];document.getElementById('uploadZone').onclick=()=>{const f='项目补充说明-'+(files.length+1)+'.pdf';files.push(f);document.getElementById('fileList').insertAdjacentHTML('beforeend',fileRow(f));bind()};function values(){const fd=new FormData(form);return{name:String(fd.get('name')||'').trim(),type:String(fd.get('type')||''),amount:Number(fd.get('amount')||0),description:String(fd.get('description')||'').trim(),sites:fd.getAll('sites'),files}}function validate(v){let ok=true;[['name',!v.name],['type',!v.type],['amount',!(v.amount>0)],['description',!v.description],['sites',!v.sites.length]].forEach(([k,bad])=>{const el=form.querySelector(`[data-field="${k}"]`);el?.classList.toggle('invalid',bad);if(bad)ok=false});return ok}function persist(status){const v=values();if(status!=='DRAFT'&&!validate(v)){toast('请完整填写必填信息',true);return}if(p){Object.assign(p,v,{status,updated:now()});if(status!=='DRAFT'){p.version=`学校流程 V${store.settings.schoolEnabled?3:'关闭'} / 教育局流程 V${store.settings.bureauEnabled?5:'关闭'}`;p.trace.push({node:'申请人重新提交',actor:actor().name,result:'提交',time:p.updated,opinion:'已按退回意见修改并重新提交。'});p.status=store.settings.schoolEnabled?'SCHOOL_PENDING':store.settings.bureauEnabled?'BUREAU_PENDING':'MEETING_PENDING';if(!store.settings.schoolEnabled&&store.settings.bureauEnabled)p.trace.push({node:'教育局业务科审批',actor:'待处理',result:'待审批',time:'—',opinion:''})}}else{const time=now(),id=(status==='DRAFT'?'D':'P')+new Date().toISOString().slice(0,10).replaceAll('-','')+String(Date.now()).slice(-4);const np={...v,id,school:actor().org,applicant:actor().name,status,created:time,updated:time,version:'未生成',trace:[]};if(status!=='DRAFT'){np.version=`学校流程 V${store.settings.schoolEnabled?3:'关闭'} / 教育局流程 V${store.settings.bureauEnabled?5:'关闭'}`;np.status=store.settings.schoolEnabled?'SCHOOL_PENDING':store.settings.bureauEnabled?'BUREAU_PENDING':'MEETING_PENDING';np.trace=[{node:'申请人提交',actor:actor().name,result:'提交',time,opinion:'申请材料已确认并提交。'}];if(!store.settings.schoolEnabled&&store.settings.bureauEnabled)np.trace.push({node:'教育局业务科审批',actor:'待处理',result:'待审批',time:'—',opinion:''})}store.projects.unshift(np)}save();page='establishment';establishmentTab=status==='DRAFT'?'management':store.settings.schoolEnabled?'approval':'management';toast(status==='DRAFT'?'草稿已保存':store.settings.schoolEnabled?'项目已提交至学校内部审批':store.settings.bureauEnabled?'项目已直接提交至教育局':'项目已直接进入会议记录阶段');render()}form.onsubmit=e=>{e.preventDefault();persist('SUBMIT')};document.getElementById('saveDraft').onclick=()=>persist('DRAFT')}
    function switchPortal(next,preferred){portal=next;window.parent.postMessage({type:'project-portal',portal:next},'*');const allowed=Object.entries(actors).filter(([,a])=>a.portal===next).map(([k])=>k);actorKey=preferred&&allowed.includes(preferred)?preferred:allowed[0];page='establishment';document.getElementById('identityMenu').classList.add('hidden');render()}
    function render(){renderShell();const c=document.getElementById('content');if(page==='dashboard')c.innerHTML=portal==='school'?schoolDashboard():bureauDashboard();else if(page==='establishment')c.innerHTML=establishmentPage();else if(page==='new')c.innerHTML=applicationPage();else if(page.startsWith('edit:'))c.innerHTML=applicationPage(page.split(':')[1]);else if(['projects','drafts','schoolPending','bureauPending','processed','all'].includes(page))c.innerHTML=listPage(page);else if(page==='sites')c.innerHTML=sitesPage();else if(page==='types')c.innerHTML=typesPage();else if(page==='flow')c.innerHTML=flowPage();else if(page==='stats')c.innerHTML=statsPage();bind()}
    document.querySelectorAll('[data-portal]').forEach(b=>b.onclick=()=>switchPortal(b.dataset.portal,b.dataset.portal==='school'?'applicant':'bureauApprover'));document.getElementById('identityBtn').onclick=()=>document.getElementById('identityMenu').classList.toggle('hidden');document.getElementById('guideBtn').onclick=guideModal;document.addEventListener('click',e=>{if(document.body.classList.contains('approval-v3'))return;const a=e.target.closest('[data-actor]');if(a){actorKey=a.dataset.actor;page='dashboard';document.getElementById('identityMenu').classList.add('hidden');toast(`已切换为${actor().role}`);render()}if(e.target.closest('#resetDemo')){store=initial();save();document.getElementById('identityMenu').classList.add('hidden');page='dashboard';toast('演示数据已重置');render()}if(!e.target.closest('.identity'))document.getElementById('identityMenu').classList.add('hidden')});render();

    function meetingsPage(){const rows=approvedProjects();return head('会议记录','')+`<div class="card"><div class="toolbar"><div class="filter-grid meeting-filter"><input class="input" id="meetingNameFilter" placeholder="项目名称或项目编号"><select class="select" id="meetingSchoolFilter"><option value="">全部学校</option>${[...new Set(rows.map(p=>p.school))].map(x=>`<option>${esc(x)}</option>`).join('')}</select><select class="select" id="meetingTypeFilter"><option value="">全部项目类型</option>${[...new Set(rows.map(p=>p.type))].map(x=>`<option>${esc(x)}</option>`).join('')}</select><select class="select" id="meetingStatusFilter"><option value="">全部会议状态</option>${Object.entries(meetingMap).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join('')}</select><button class="btn primary" id="meetingFilterBtn">查询</button></div></div><div id="meetingTable">${meetingTable(rows)}</div></div>`}

    function meetingModal(id){const p=store.projects.find(x=>x.id===id);if(!p||p.status!=='APPROVED'){toast('只有最终审批通过的项目才能登记会议记录',true);return}const nextNo=meetingsFor(p).length+1,sites=p.sites.map(x=>store.sites.find(s=>s.id===x)?.name||x).join('、');$('#modalRoot').innerHTML=`<div class="modal-mask"><form class="modal large" id="meetingForm" data-project="${p.id}"><div class="modal-head"><div><h2>${nextNo===1?'登记':'新增'}会议记录</h2><small>${esc(p.name)} · 第${nextNo}次会议</small></div><button type="button" class="close" data-close>×</button></div><div class="modal-body"><div class="form-title">项目摘要</div><div class="detail-grid"><div class="detail-item"><label>项目编号</label>${p.id}</div><div class="detail-item"><label>项目名称</label>${esc(p.name)}</div><div class="detail-item"><label>申报学校</label>${esc(p.school)}</div><div class="detail-item"><label>项目类型</label>${esc(p.type)}</div><div class="detail-item"><label>计划投资金额</label>${money(p.amount)}</div><div class="detail-item"><label>项目审批状态</label>${statusTag(p.status)}</div><div class="detail-item full"><label>关联场地</label>${esc(sites)}</div><div class="detail-item"><label>当前会议状态</label>${smallTag(meetingMap,p.meetingStatus)}</div></div><div class="form-title" style="margin-top:22px">会议基本信息</div><div class="form-grid"><div class="field full"><label class="required">会议名称</label><input class="input" name="meetingName"></div><div class="field"><label class="required">会议时间</label><input class="input" type="datetime-local" name="meetingTime"></div><div class="field"><label>会议地点</label><input class="input" name="meetingPlace"></div><div class="field"><label>主持人</label><input class="input" name="hostName"></div><div class="field"><label>记录人</label><input class="input" name="recorderName"></div><div class="field full"><label>参会人员</label><input class="input" name="attendees" placeholder="多个人员使用顿号或逗号分隔"></div><div class="field full"><label>会议议题</label><input class="input" name="topic"></div><div class="field full"><label>会议内容摘要</label><texta les.splice(Number(b.dataset.draftFile),1);renderFiles()})};fileInput.onchange=()=>{draftFiles.push(...[...fileInput.files].map(f=>meetingAttachment(f)));fileInput.value='';renderFiles()};resultSelect.onchange=()=>{const result=resultSelect.value,[cls,msg]=meetingResultHint(result),hint=$('#meetingResultHint');hint.className='meeting-result-hint '+cls;hint.textContent=msg;$('#meetingSupplementFields').hidden=result!=='SUPPLEMENT'};form.onsubmit=e=>{e.preventDefault();const fd=new FormData(form),name=String(fd.get('meetingName')||'').trim(),time=String(fd.get('meetingTime')||''),result=String(fd.get('result')||''),requirements=String(fd.get('supplementRequirements')||'').trim();if(!store.projects.some(x=>x.id===p.id)||p.status!=='APPROVED'){toast('项目不存在或尚未完成最终审批',true);return}if(!name||!time||!result){toast('请填写会议名称、会议时间并选择会议结果',true);return}if(result==='SUPPLEMENT'&&!requirements){toast('会议结果为补充材料时，必须填写需要补充的材料',true);return}if(!confirm('确认保存本次会议记录吗？保存后学校端可以查看会议结果。'))return;const record=createMeetingRecord(p,{meetingName:name,meetingTime:time.replace('T',' '),meetingPlace:String(fd.get('meetingPlace')||''),hostName:String(fd.get('hostName')||''),recorderName:String(fd.get('recorderName')||''),attendees:String(fd.get('attendees')||''),topic:String(fd.get('topic')||''),summary:String(fd.get('summary')||''),opinion:String(fd.get('opinion')||''),result,supplementRequirements:requirements,supplementNote:String(fd.get('supplementNote')||''),suggestedCompletionDate:String(fd.get('suggestedCompletionDate')||''),remark:String(fd.get('remark')||''),attachments:draftFiles,createdBy:actors[actorKey].name,createdAt:now()});store.meetingRecords.push(record);syncMeetingSummary(p);opRecord(p,`登记第${record.meetingNo}次会议`,`${record.meetingName}，结果：${meetingMap[result][0]}`,'教育局端',actors[actorKey].name);opRecord(p,result==='PASSED'?'会议结果通过':result==='SUPPLEMENT'?'会议要求补充材料':'会议未通过',result==='SUPPLEMENT'?requirements:(record.opinion||meetingMap[result][0]),'教育局端',actors[actorKey].name);save();closeModal();toast('会议记录保存成功');render()}}

    function projectLifecycleStatus(p){

      if(!contracts.length)return result('待登记合同','blue',4);
      const starts=(d.startApplications||[]).filter(x=>x.projectId===pid).sort((a,b)=>String(b.updatedAt||b.createdAt||'').localeCompare(String(a.updatedAt||a.createdAt||''))),start=starts[0];

    function paymentPage(){const d=read(),isBureau=portal()==='bureau',rows=d.payments.filter(x=>isBureau?!['DRAFT','WITHDRAWN','SCHOOL_PENDING'].includes(x.status):x.school===SCHOOL),approvedTotal=rows.filter(x=>x.status==='APPROVED').reduce((n,x)=>n+x.amount,0),pendingTotal=rows.filter(x=>['SCHOOL_PENDING','BUREAU_PENDING','APPROVING'].includes(x.status)).reduce((n,x)=>n+x.amount,0);return pageHead(isBureau?'付款申请审批':'付款申请',isBureau?'审核学校按合同提交的付款申请，审批结果同步至学校端。':'按已开工项目与有效合同发起付款，支持先付款、后登记发票。',isBureau?'':`<button class="btn primary" data-p5-payment-new><i class="ri-add-line"></i>新建付款申请</button>`)+`<div class="p5-finance-tip"><i class="ri-information-line"></i><div><b>演示规则：</b>付款申请不要求先取得发票；待审批与审批通过金额占用合同额度，草稿、退回和已撤回不占用。</div></div><div class="kpis p5-kpis"><div class="kpi"><div><div class="kpi-label">付款申请总数</div><div class="kpi-value">${rows.length}</div></div></div><div class="kpi"><div><div class="kpi-label">待审批金额</div><div class="kpi-value">${money(pendingTotal)}</div></div></div><div class="kpi"><div><div class="kpi-label">审批通过金额</div><div class="kpi-value">${money(approvedTotal)}</div></div></div><div class="kpi"><div><div class="kpi-label">未取得发票申请</div><div class="kpi-value">${rows.filter(x=>x.hasInvoice==='NOT_YET').length}</div></div></div><div class="kpi"><div><div class="kpi-label">已登记发票</div><div class="kpi-value">${d.invoices.filter(x=>x.status==='REGISTERED').length}</div></div></div></div><section class="card"><div class="toolbar"><div class="search"><i class="ri-search-line"></i><input class="input" id="p5PaymentKeyword" placeholder="搜索申请编号、项目或合同"></div><select class="select" id="p5PaymentStatus"><option value="">全部状态</option>${Object.entries(statusMap).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join('')}</select><select class="select" id="p5PaymentType"><option value="">全部付款类型</option>${['预付款','进度款','到货款','验收款','质保金','其他款项'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="table-wrap" id="p5PaymentTable">${paymentTable(d,     function invoiceTable(d,rows,isBureau){return rows.length?`<table><thead><tr><th>发票号码</th><th>类型</th>${isBureau?'<th>申报学校</th>':''}<th>销售方</th><th>项目 / 合同</th><th>关联付款申请</th><th>发票金额</th><th>开票日期</th><th>状态</th><th>操作</th></tr></thead><tbody>${rows.map(x=>{const p=project(d,x.projectId),c=contract(d,x.contractId),pay=payment(d,x.paymentId);let actions=`<button class="btn link" data-p5-invoice-view="${x.id}">查看</button>`;if(!isBureau&&x.status==='REGISTERED')actions+=`<button class="btn link" data-p5-invoice-edit="${x.id}">编辑</button><button class="btn link" data-p5-invoice-link="${x.id}">${x.paymentId?'更换关联':'关联付款'}</button><button class="btn link" data-p5-invoice-void="${x.id}">作废</button>`;return `<tr><td><div class="project-cell"><b>${esc(x.number)}</b><span>${esc(x.code||'无发票代码')}</span></div></td><td>${esc(x.type)}</td>${isBureau?`<td>${esc(x.school||SCHOOL)}</td>`:''}<td>${esc(x.seller)}</td><td>${esc(p?.name||'—')}<br><span class="p5-muted">${esc(c?.name||'—')}</span></td><td>${pay?`<button class="p5-link" data-p5-payment-view="${pay.id}">${esc(pay.no)}</button>`:'<span class="tag">暂未关联</span>'}</td><td class="amount">${money(x.amount)}</td><td>${esc(x.issueDate)}</td><td>${tag(invoiceStatus,x.status)}</td><td><div class="p5-inline-actions">${actions}</div></td></tr>`}).join('')}</tbody></table>`:'<div class="empty"><i class="ri-inbox-2-line"></i>暂无符合条件的发票记录</div>'}
    function invoicePage(){const d=read(),isBureau=portal()==='bureau',rows=d.invoices.filter(x=>isBureau||(x.school||SCHOOL)===SCHOOL),valid=rows.filter(x=>x.status==='REGISTERED');return pageHead('发票管理',isBureau?'只读查看学校登记的发票及其项目、合同、付款关联。':'登记合同发票，可在付款审批通过后补充，也可暂不关联具体付款申请。',isBureau?'':`<button class="btn primary" data-p5-invoice-new><i class="ri-add-line"></i>登记发票</button>`)+`<div class="kpis p5-kpis"><div class="kpi"><div><div class="kpi-label">发票记录</div><div class="kpi-value">${rows.length}</div></div></div><div class="kpi"><div><div class="kpi-label">有效发票金额</div><div class="kpi-value">${money(valid.reduce((n,x)=>n+x.amount,0))}</div></div></div><div class="kpi"><div><div class="kpi-label">已关联付款</div><div class="kpi-value">${valid.filter(x=>x.paymentId).length}</div></div></div><div class="kpi"><div><div class="kpi-label">暂未关联</div><div class="kpi-value">${valid.filter(x=>!x.paymentId).length}</div></div></div><div class="kpi"><div><div class="kpi-label">已作废</div><div class="kpi-value">${rows.filter(x=>x.status==='VOID').length}</div></div></div></div><section class="card"><div class="toolbar"><div class="search"><i class="ri-search-line"></i><input class="input" id="p5InvoiceKeyword" placeholder="搜索发票号码、项目或合同"></div><select class="select" id="p5InvoiceLinked"><option value="">全部关联状态</option><option value="linked">已关联付款</option><option value="unlinked">暂未关联付款</option></select><select class="select" id="p5InvoiceStatus"><option value="">全部状态</option><option value="REGISTERED">已登记</option><option value="VOID">已作废</option></select><span class="p5-muted">开票日期</span><input class="input" type="date" id="p5InvoiceDateFrom" title="开票日期开始" style="width:150px"><span class="p5-muted">至</span><input class="input" type="date" id="p5InvoiceDateTo" title="开票日期结束" style="width:150px"></div><div class="table-wrap" id="p5InvoiceTable">${invoiceTable(d,rows,isBureau)}</div></section>`}
    function paymentRowsP5(d,isBureau){return d.payments.filter(x=>isBureau?!['DRAFT','WITHDRAWN','SCHOOL_PENDING'].includes(x.status):x.school===SCHOOL&&(paymentTab==='management'||x.status==='SCHOOL_PENDING'))}
    function paymentTable(d,rows,isBureau,approvalView=false){return rows.length?`<table><thead><tr><th>付款申请</th><th>项目 / 合同</th>${isBureau?'<th>申报学校</th>':''}<th>收款单位</th><th>付款类型</th><th>本次金额</th><th>申请日期</th><th>当前节点</th><th>状态</th><th>操作</th></tr></thead><tbody>${rows.map(x=>{const p=project(d,x.projectId),c=contract(d,x.contractId);let actions=`<button class="btn link" data-p5-payment-view="${x.id}">查看</button>`;if(!isBureau){if(approvalView&&x.status==='SCHOOL_PENDING')actions+=`<button class="btn link" data-p5-payment-school-approve="${x.id}">审批</button>`;if(!approvalView){if(['DRAFT','RETURNED','WITHDRAWN'].includes(x.status))actions+=`<button class="btn link" data-p5-payment-edit="${x.id}">编辑</button><button class="btn link" data-p5-payment-submit="${x.id}">${x.status==='DRAFT'?'提交':'重新提交'}</button>`;if(['DRAFT','WITHDRAWN'].includes(x.status))actions+=`<button class="btn link" data-p5-payment-delete="${x.id}">删除</button>`;if(['SCHOOL_PENDING','BUREAU_PENDING','APPROVING'].includes(x.status))actions+=`<button class="btn link" data-p5-payment-withdraw="${x.id}">撤回</button>`;if(x.status==='APPROVED')actions+=`<button class="btn link" data-p5-invoice-new="${x.id}">登记发票</button>`}}else if(['BUREAU_PENDING','APPROVING'].includes(x.status))actions+=`<button class="btn link" data-p5-payment-approve="${x.id}">审批</button>`;return `<tr><td><div class="project-cell"><b>${esc(x.no)}</b><span>${esc(x.name)}</span></div></td><td><button class="p5-link" data-p4-project="${p?.id||''}">${esc(p?.name||'—')}</button><br><span class="p5-muted">${esc(c?.name||'—')}</span></td>${isBureau?`<td>${esc(x.school)}</td>`:''}<td>${esc(x.payee)}</td><td>${esc(x.paymentType)}</td><td class="amount">${money(x.amount)}</td><td>${esc(x.applyDate||'—')}</td><td>${esc(x.currentNode||'—')}</td><td>${tag(statusMap,x.status)}</td><td><div class="p5-inline-actions">${actions}</div></td></tr>`}).join('')}</tbody></table>`:'<div class="empty"><i class="ri-inbox-2-line"></i>暂无符合条件的付款申请</div>'}
    function paymentPage(){const d=read(),isBureau=portal()==='bureau',rows=paymentRowsP5(d,isBureau),approvedTotal=rows.filter(x=>x.status==='APPROVED').reduce((n,x)=>n+x.amount,0),pendingTotal=rows.filter(x=>['SCHOOL_PENDING','BUREAU_PENDING','APPROVING'].includes(x.status)).reduce((n,x)=>n+x.amount,0);return pageHead(isBureau?'付款申请审批':'付款申请','',isBureau||paymentTab==='approval'?'':`<button class="btn primary" data-p5-payment-new><i class="ri-add-line"></i>新建付款申请</button>`)+(isBureau?'':`<div class="card p4-module-tabs"><div class="tabs"><button class="tab ${paymentTab==='management'?'active':''}" data-p5-payment-tab="management">付款申请</button><button class="tab ${paymentTab==='approval'?'active':''}" data-p5-payment-tab="approval">付款审批</button></div></div>`)+`<div class="kpis p5-kpis"><div class="kpi"><div><div class="kpi-label">付款申请总数</div><div class="kpi-value">${rows.length}</div></div></div><div class="kpi"><div><div class="kpi-label">待审批金额</div><div class="kpi-value">${money(pendingTotal)}</div></div></div><div class="kpi"><div><div class="kpi-label">审批通过金额</div><div class="kpi-value">${money(approvedTotal)}</div></div></div><div class="kpi"><div><div class="kpi-label">未取得发票申请</div><div class="kpi-value">${rows.filter(x=>x.hasInvoice==='NOT_YET').length}</div></div></div><div class="kpi"><div><div class="kpi-label">已登记发票</div><div class="kpi-value">${d.invoices.filter(x=>x.status==='REGISTERED').length}</div></div></div></div><section class="card"><div class="toolbar"><div class="search"><i class="ri-search-line"></i><input class="input" id="p5PaymentKeyword" placeholder="搜索申请编号、项目或合同"></div><select class="select" id="p5PaymentStatus"><option value="">全部状态</option>${Object.entries(statusMap).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join('')}</select><select class="select" id="p5PaymentType"><option value="">全部付款类型</option>${['预付款','进度款','到货款','验收款','质保金','其他款项'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="table-wrap" id="p     function bindFinance(){const d=read(),isBureau=portal()==='bureau';const pk=$('#p5PaymentKeyword'),ps=$('#p5PaymentStatus'),pt=$('#p5PaymentType');if(pk){const run=()=>{let rows=paymentRowsP5(d,isBureau),key=pk.value.toLowerCase();rows=rows.filter(x=>(x.no+x.name+(project(d,x.projectId)?.name||'')+(contract(d,x.contractId)?.name||'')).toLowerCase().includes(key)&&(!ps.value||x.status===ps.value)&&(!pt.value||x.paymentType===pt.value));$('#p5PaymentTable').innerHTML=paymentTable(d,rows,isBureau,paymentTab==='approval')};pk.oninput=ps.onchange=pt.onchange=run}const ik=$('#p5InvoiceKeyword'),il=$('#p5InvoiceLinked'),ist=$('#p5InvoiceStatus'),idf=$('#p5InvoiceDateFrom'),idt=$('#p5InvoiceDateTo');if(ik){const run=()=>{const key=ik.value.toLowerCase(),from=idf.value,to=idt.value,rows=d.invoices.filter(x=>(isBureau||(x.school||SCHOOL)===SCHOOL)&&(x.number+(project(d,x.projectId)?.name||'')+(contract(d,x.contractId)?.name||'')).toLowerCase().includes(key)&&(!il.value||(il.value==='linked'?!!x.paymentId:!x.paymentId))&&(!ist.value||x.status===ist.value)&&(!from||String(x.issueDate||'')>=from)&&(!to||String(x.issueDate||'')<=to));$('#p5InvoiceTable').innerHTML=invoiceTable(d,rows,isBureau)};ik.oninput=il.onchange=ist.onchange=idf.onchange=idt.onchange=run}const st=$('#p5PaymentSetting');if(st)st.onclick=()=>{d.settings.paymentSchoolApproval=!d.settings.paymentSchoolApproval;write(d);toast('付款审批设置已更新');renderFinance('settings')}}
    function settingsPage(){const d=read();return pageHead('付款审批设置','单独配置学校内部付款审批，关闭后申请直接进入教育局审批。')+`<section class="card"><div class="card-head"><h2>付款申请审批</h2><span class="p5-status-hint"><span class="p5-status-dot"></span>配置已保存至本机演示数据</span></div><div class="card-body"><div class="rule"><div class="rule-index"><i class="ri-shield-check-line"></i></div><div class="rule-copy"><b>是否启用付款申请内部审批</b><span>开启：学校提交 → 学校内部审批 → 教育局审批；关闭：学校提交 → 教育局审批。</span></div><button class="switch ${d.settings.paymentSchoolApproval?'on':''}" id="p5PaymentSetting" aria-label="切换付款内部审批"></button></div><div class="form-title p5-section">教育局付款流程</div><div class="rule"><div class="rule-index">1</div><div class="rule-copy"><b>普通付款流程</b><span>单次付款不超过 20 万元：业务科室审核 → 财务审核</span></div><span class="tag green">已启用</span></div><div class="rule"><div class="rule-index">2</div><div class="rule-copy"><b>大额付款流程</b><span>单次付款超过 20 万元：业务科室审核 → 财务审核 → 分管领导审批</span></div><span class="tag green">已启用</span></div></div></section>`}

    .unified-detail .detail-hero{padding:16px 20px}.unified-detail .lifecycle{padding:12px 4px 2px;margin-top:12px}.unified-detail .life-step{min-width:82px}.unified-detail .life-step:before{top:11px}.unified-detail .life-dot{width:24px;height:24px;font-size:10px}.unified-detail .life-step.active .life-dot{box-shadow:0 0 0 3px var(--blue-soft)}.unified-detail .life-step b{margin-top:5px;font-size:11px}.unified-detail .life-step span{display:none}.unified-detail .basic-grid>.basic-item.full,.unified-detail .module-body>.notice,.unified-detail [data-unified-stage="archive"],.unified-detail [data-p7-project-archive]{display:none!important}

  <script>
  (()=>{
    const KEY='edu-project-phase2-demo-v2';
    const $=s=>document.querySelector(s),all=s=>[...document.querySelectorAll(s)];
    const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
    const read=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch{return {}}};
    const money=n=>'¥ '+Number(n||0).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
    const arr=v=>Array.isArray(v)?v:[];
    const statusMap={DRAFT:['草稿',''],SCHOOL_PENDING:['待学校内部审批','orange'],SCHOOL_RETURNED:['审批退回','red'],BUREAU_PENDING:['待教育局审批','blue'],BUREAU_PROCESSING:['待教育局审批','blue'],APPROVED:['审批通过','green'],BUREAU_RETURNED:['审批退回','red'],RETURNED:['审批退回','red'],MEETING_PENDING:['审批通过','green'],WITHDRAWN:['已撤回','']};
    const meetingMap={PENDING:['待登记','orange'],PASSED:['会议通过','green'],SUPPLEMENT:['补充材料','orange'],REJECTED:['会议未通过','red']};
    const tag=(text,color='')=>`<span class="tag ${color}">${esc(text)}</span>`;
    const projectStatus=p=>statusMap[p.status]||[p.status||'未开始',''];
    const fileName=f=>typeof f==='string'?f:f?.name||'附件';
    const fileSize=f=>typeof f==='object'&&f?.size?`${(Number(f.size)/1024).toFixed(1)} KB`:'演示文件';
    const filesHtml=files=>arr(files).length?arr(files).map(f=>`<div class="file-chip"><i class="ri-attachment-2"></i><b>${esc(fileName(f))}</b><span>${fileSize(f)}</span><button class="btn link" data-unified-file-preview="${encodeURIComponent(JSON.stringify({name:fileName(f),size:Number(f?.size||0),type:f?.type||'附件'}))}">预览</button></div>`).join(''):`<div class="empty-state"><b>暂无相关附件</b><span>当前模块尚未形成附件资料。</span></div>`;
    const empty=(title,desc)=>`<div class="empty-state"><b>${esc(title)}</b><span>${esc(desc)}</span></div>`;
    const normalizeLabels=()=>{all('.sidebar .nav-btn').forEach(button=>{const span=button.querySelector('span');if(span?.textContent.trim()==='项目立项')span.textContent='项目管理';if(span&&/工作台$/.test(span.textContent.trim()))button.remove()})};
    function context(id){const d=read(),p=arr(d.projects).find(x=>x.id===id);if(!p)return null;const sites=arr(d.sites).filter(x=>arr(p.sites).includes(x.id)),meetings=arr(d.meetingRecords).filter(x=>x.projectId===id).sort((a,b)=>String(b.meetingTime||b.createdAt||'').localeCompare(String(a.meetingTime||a.createdAt||''))),purchases=[...arr(d.purchases).filter(x=>x.projectId===id),...arr(p.procurements).filter(x=>!arr(d.purchases).some(y=>y.id===x.id))],contracts=arr(d.contracts).filter(x=>x.projectId===id),starts=arr(d.startApplications).filter(x=>x.projectId===id),payments=arr(d.payments).filter(x=>x.projectId===id),invoices=arr(d.invoices).filter(x=>x.projectId===id);if(!meetings.length&&p.meeting)meetings.push({meetingName:p.meeting.name||'项目专题会议',meetingTime:p.meeting.date||p.meeting.updatedAt,result:p.meetingStatus||p.meeting.result,meetingPlace:p.meeting.place,hostName:p.meeting.host,attendees:p.meeting.attendees,opinion:p.meeting.opinion,attachments:p.meeting.files});return{d,p,sites,meetings,purchases,contracts,starts,payments,invoices}}
    function stageData(c){const {p,meetings,purchases,contracts,starts,payments}=c,meetingDone=meetings.some(x=>['PASSED','通过'].includes(x.result))||p.meetingStatus==='PASSED',schemeDone=arr(p.scheme?.files).length>0,purchaseDone=purchases.length>0&&purchases.every(x=>x.status==='APPROVED'),startDone=starts.some(x=>x.status==='APPROVED')||p.implementationStatus==='施工中',paymentDone=payments.some(x=>x.status==='APPROVED');return[
      ['申报',p.status==='DRAFT'?'active':'done',p.status==='DRAFT'?'草稿':'已提交'],
      ['审批',p.status==='APPROVED'?'done':['SCHOOL_PENDING','BUREAU_PENDING','BUREAU_PROCESSING'].includes(p.status)?'active':'',projectStatus(p)[0]],
      ['会议',meetingDone?'done':p.status==='APPROVED'?'active':'',meetingDone?'已通过':'待办理'],
      ['方案',schemeDone?'done':meetingDone?'active':'',schemeDone?'已上传':'待上传'],
      ['采购',purchaseDone?'done':purchases.length?'active':'',purchaseDone?'已完成':purchases.length?'进行中':'待开始'],
      ['合同',contracts.length?'done':purchaseDone?'active':'',contracts.length?`${contracts.length}份`:'待登记'],
      ['开工',startDone?'done':starts.length?'active':'',startDone?'施工中':starts.length?'审批中':'待申请'],
      ['付款',paymentDone?'done':payments.length?'active':'',paymentDone?'已付款':payments.length?'审批中':'待申请'],
      ['验收',p.acceptanceStatus==='PASSED'?'done':startDone?'active':'',p.acceptanceStatus==='PASSED'?'已验收':'待验收'],
      ['归档',p.archiveStatus==='ARCHIVED'?'done':'',p.archiveStatus==='ARCHIVED'?'已归档':'待归档']
    ]}
    const lifeHtml=c=>stageData(c).map((x,i)=>`<div class="life-step ${x[1]}"><div class="life-dot">${x[1]==='done'?'✓':i+1}</div><b>${x[0]}</b><span>${esc(x[2])}</span></div>`).join('');
    const recordResult=r=>r.result||r.action||'已处理';
    function recordsHtml(records){return arr(records).length?arr(records).map(r=>`<div class="record-card"><div class="record-head"><b>${esc(r.node||r.stage||r.action||'审批节点')}</b>${tag(recordResult(r),String(recordResult(r)).includes('退回')?'red':String(recordResult(r)).includes('待')?'orange':'green')}<time>${esc(r.time||r.createdAt||'—')}</time></div><p>处理人：${esc(r.person||r.actor||r.approver||'系统')}</p><div class="approval-note ${String(recordResult(r)).includes('退回')?'red-note':''}">${esc(r.opinion||r.note||'无审批意见')}</div>${arr(r.attachments).length?filesHtml(r.attachments):''}</div>`).join(''):empty('暂无审批记录','项目提交后将在此展示学校与教育局各审批节点的处理结果。')}
    function overview(c){const {p,sites}=c;return `<div class="module-title"><h2>项目概览</h2><span class="subtle">关联场地与项目附件</span></div><div class="form-title">关联场地</div><div class="venue-list">${sites.length?sites.map(s=>`<div class="venue-item"><b>${esc(s.name)}</b><div class="venue-meta"><span>场地类型<strong>${esc(s.type||'—')}</strong></span><span>用途<strong>${esc(s.purpose||'—')}</strong></span><span>建设年份<strong>${esc(s.year||'—')}</strong></span></div></div>`).join(''):empty('暂无关联场地','项目尚未关联场地。')}</div><div class="form-title" style="margin-top:22px">项目附件</div>${filesHtml(p.files)}`}
    function approval(c){const records=arr(c.p.records).length?c.p.records:c.p.trace;return `<div class="module-title"><h2>立项审批</h2><span>${tag(projectStatus(c.p)[0],projectStatus(c.p)[1])}</span></div>${recordsHtml(records)}`}
    function meeting(c){return `<div class="module-title"><h2>会议记录</h2><span>${c.meetings.length} 次会议</span></div>${c.meetings.length?c.meetings.map((r,i)=>`<div class="record-card"><div class="record-head"><b>第${r.meetingNo||c.meetings.length-i}次 · ${esc(r.meetingName||r.name||'项目专题会议')}</b>${tag(meetingMap[r.result]?.[0]||r.result||'待登记',meetingMap[r.result]?.[1]||'orange')}<time>${esc(r.meetingTime||r.date||r.createdAt||'—')}</time></div><div class="detail-grid"><div class="detail-item"><label>会议地点</label>${esc(r.meetingPlace||r.place||'—')}</div><div class="detail-item"><label>主持人</label>${esc(r.hostName||r.host||'—')}</div><div class="detail-item"><label>参会人员</label>${esc(r.attendees||'—')}</div><div class="detail-item full"><label>会议意见</label>${esc(r.opinion||r.summary||'—')}</div></div>${filesHtml(r.attachments||r.files)}</div>`).join(''):empty('暂无会议记录','项目审批通过后进入会议记录阶段。')}`}
    function scheme(c){const s=c.p.scheme;return `<div class="module-title"><h2>项目方案</h2>${tag(arr(s?.files).length?'已上传':'未上传',arr(s?.files).length?'green':'')}</div>${s?`<div class="detail-grid"><div class="detail-item"><label>方案名称</label><b>${esc(s.name||'项目实施方案')}</b></div><div class="detail-item"><label>上传人</label>${esc(s.uploadedBy||c.p.applicant||'—')}</div><div class="detail-item"><label>上传时间</label>${esc(s.uploadedAt||'—')}</div><div class="detail-item full"><label>方案说明</label>${esc(s.description||'—')}</div></div><div class="form-title" style="margin-top:20px">方案附件</div>${filesHtml(s.files)}`:empty('尚未形成项目方案','会议通过后由学校维护项目方案及附件。')}`}
    function purchase(c){return `<div class="module-title"><h2>采购信息</h2><span>${c.purchases.length} 个采购包</span></div>${c.purchases.length?`<div class="relation-list">${c.purchases.map(x=>`<div class="relation-row"><div class="relation-icon">采</div><div class="relation-copy"><b>${esc(x.id||x.no)} · ${esc(x.name)}</b><span>${esc(x.method||x.purchaseMethod||'采购方式未设置')} · 预算 ${money(x.approvedAmount||x.budget)} · ${esc(x.owner||'张老师')}</span></div>${tag(x.status==='APPROVED'?'审批通过':x.status==='RETURNED'?'审批退回':'审批中',x.status==='APPROVED'?'green':x.status==='RETURNED'?'red':'blue')}</div>`).join('')}</div>`:empty('暂无采购信息','项目方案确认后可创建采购包并发起采购审批。')}`}
    function contracts(c){return `<div class="module-title"><h2>合同信息</h2><span>${c.contracts.length} 份合同</span></div>${c.contracts.length?`<div class="summary-cards"><div class="summary-card"><label>合同数量</label><b>${c.contracts.length} 份</b></div><div class="summary-card"><label>合同总金额</label><b>${money(c.contracts.reduce((n,x)=>n+Number(x.amount||0),0))}</b></div></div><div class="relation-list">${c.contracts.map(x=>`<div class="relation-row"><div class="relation-icon">合</div><div class="relation-copy"><b>${esc(x.no)} · ${esc(x.name)}</b><span>${esc(x.partyA||c.p.school)} → ${esc(x.partyB||'—')} · 签订日期 ${esc(x.signDate||'—')}</span></div>${tag(x.status==='ACTIVE'?'有效':x.status||'已登记',x.status==='ACTIVE'?'green':'')}</div>`).join('')}</div>`:empty('暂无关联合同','采购审批通过后可登记合同。')}`}
    function starts(c){return `<div class="module-title"><h2>开工信息</h2><span>${c.starts.length} 条申请</span></div>${c.starts.length?c.starts.map(x=>`<div class="record-card"><div class="record-head"><b>${esc(x.no||'开工申请')} · ${esc(x.constructionUnit||'施工单位待定')}</b>${tag(x.status==='APPROVED'?'审批通过':x.status==='RETURNED'?'审批退回':'审批中',x.status==='APPROVED'?'green':x.status==='RETURNED'?'red':'blue')}</div><div class="detail-grid"><div class="detail-item"><label>计划工期</label>${esc(x.planStart||'—')} 至 ${esc(x.planEnd||'—')}</div><div class="detail-item"><label>监理单位</label>${esc(x.supervisionUnit||'—')}</div><div class="detail-item"><label>当前节点</label>${esc(x.currentNode||'—')}</div><div class="detail-item full"><label>开工条件</label>${esc(x.conditions||'—')}</div></div></div>`).join(''):empty('暂无开工申请','合同生效后由学校发起开工申请。')}`}
    function payments(c){const approved=c.payments.filter(x=>x.status==='APPROVED').reduce((n,x)=>n+Number(x.amount||0),0);return `<div class="module-title"><h2>付款与发票</h2><span>${c.payments.length} 笔付款 · ${c.invoices.length} 张发票</span></div><div class="summary-cards"><div class="summary-card"><label>付款申请</label><b>${c.payments.length} 笔</b></div><div class="summary-card"><label>审批通过金额</label><b>${money(approved)}</b></div><div class="summary-card"><label>发票数量</label><b>${c.invoices.length} 张</b></div><div class="summary-card"><label>有效发票金额</label><b>${money(c.invoices.filter(x=>x.status!=='VOID').reduce((n,x)=>n+Number(x.amount||0),0))}</b></div></div><div class="form-title">付款申请</div>${c.payments.length?`<div class="relation-list">${c.payments.map(x=>`<div class="relation-row"><div class="relation-icon">付</div><div class="relation-copy"><b>${esc(x.no)} · ${esc(x.name)}</b><span>${esc(x.payee||'—')} · ${esc(x.paymentType||'—')} · ${money(x.amount)}</span></div>${tag(x.status==='APPROVED'?'审批通过':x.status==='RETURNED'?'审批退回':'审批中',x.status==='APPROVED'?'green':x.status==='RETURNED'?'red':'blue')}</div>`).join('')}</div>`:empty('暂无付款申请','项目开工后可依据合同发起付款。')}<div class="form-title" style="margin-top:22px">发票记录</div>${c.invoices.length?`<div class="relation-list">${c.invoices.map(x=>`<div class="relation-row"><div class="relation-icon">票</div><div class="relation-copy"><b>${esc(x.number)} · ${money(x.amount)}</b><span>${esc(x.seller||'—')} · ${esc(x.issueDate||'—')} · ${x.paymentId?'已关联付款':'暂未关联付款'}</span></div>${tag(x.status==='VOID'?'已作废':'已登记',x.status==='VOID'?'red':'green')}</div>`).join('')}</div>`:empty('暂无发票记录','发票可以在付款前后登记并与付款申请关联。')}`}
    function acceptance(c){const rows=arr(c.p.acceptanceRecords);return `<div class="module-title"><h2>验收信息</h2>${tag(c.p.acceptanceStatus==='PASSED'?'验收通过':'待验收',c.p.acceptanceStatus==='PASSED'?'green':'orange')}</div>${rows.length?recordsHtml(rows):empty('暂无验收记录','项目施工完成后登记验收结果、问题清单和验收附件。')}`}

    function queryModal(){const enabled=materials().filter(x=>x.status==='ENABLED');q('#modalRoot').innerHTML=`<div class="modal-mask"><div class="modal m8-modal-wide" id="m8Query"><div class="modal-head"><div><h2>材料价格查询</h2><small>教育局内部人工参考，不会修改项目预算、采购申请或审批意见</small></div><button class="close" data-m8-close>×</button></div><div class="modal-body"><div class="m8-query-note">材料价格来自历史供应商报价，仅供预算审核参考，不代表最终成交价格。</div><div class="m8-filter"><input class="input" name="keyword" placeholder="材料名称"><select class="select" name="category">${categoryOptions('')}</select><input class="input" name="brand" placeholder="品牌"><input class="input" name="spec" placeholder="规格型号"><input class="input" name="material" placeholder="材质"><input class="input" name="supplier" placeholder="供应商"><div class="m8-filter-actions"><button class="btn" data-m8-query-clear>重置</button><button class="btn primary" data-m8-query-run>查询</button></div></div><div class="table-wrap" data-m8-query-table></div></div><div class="modal-foot"><button class="btn" data-m8-close>关闭</button></div></div></div>`;const run=()=>{const root=q('#m8Query'),get=n=>q(`[name="${n}"]`,root).value.trim(),qs=quotes(),rows=enabled.filter(m=>(!get('keyword')||m.name.includes(get('keyword')))&&(!get('category')||m.category===get('category'))&&(!get('brand')||m.brand.includes(get('brand')))&&(!get('spec')||m.specification.includes(get('spec')))&&(!get('material')||m.material.includes(get('material')))&&(!get('supplier')||qs.filter(x=>x.materialId===m.id).some(x=>x.supplierName.includes(get('supplier')))));q('[data-m8-query-table]',root).innerHTML=`<table><thead><tr><th>材料名称</th><th>类型</th><th>品牌</th><th>规格型号</th><th>材质</th><th>单位</th><th>最新参考价</th><th>供应商数</th><th>操作</th></tr></thead><tbody>${rows.length?rows.map(m=>`<tr><td><b>${esc(m.name)}</b></td><td>${esc(m.type)}</td><td>${esc(m.brand||'—')}</td><td>${esc(m.specification)}</td><td>${esc(m.material)}</td><td>${esc(m.unit)}</td><td>${reference(m).html}</td><td>${new Set(qs.filter(x=>x.materialId===m.id).map(x=>x.supplierName)).size} 家</td><td><button class="btn link" data-m8-view="${m.id}">查看价格详情</button></td></tr>`).join(''):`<tr><td colspan="9"><div class="m8-empty">暂无符合条件的启用材料</div></td></tr>`}</tbody></table>`};run();q('[data-m8-query-run]').onclick=run;q('[data-m8-query-clear]').onclick=()=>{qa('input',q('#m8Query')).forEach(x=>x.value='');qa('select',q('#m8Query')).forEach(x=>x.value='');run()}}

    const observer=new MutationObserver(()=>{ensureNav();augmentDetails();if(active&&!isBureau())active=false});observer.observe(document.body,{childList:true,subtree:true});init();ensureNav();augmentDetails();document.documentElement.dataset.materialLibraryReady='1';

  <script>

        document.querySelectorAll('button').forEach(button=>{const label=button.textContent.replace(/\s+/g,'').trim();if(/^重置第.+步数据$/.test(label))button.remove()});
        document.querySelectorAll('.sidebar .nav-group-title').forEach(title=>title.remove());

      document.querySelectorAll('.sidebar .nav-group-title').forEach(title=>{if(title.textContent.trim()!=='演示工具')return;let next=title.nextElementSibling;while(next&&!next.classList.contains('nav-group-title')){const current=next;next=next.nextElementSibling;current.remove()}title.remove()});

  <script>
  (()=>{

    const read=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch{return {}}};
    const arrays=data=>['projects','purchases','procurements','startApplications','payments','projectEvents','finalAcceptances','projectArchives'].flatMap(name=>(data[name]||[]).map(item=>({item,kind:name})));
    const displayId=item=>String(item.id||item.no||'');
    const entityFor=(root,data)=>{const text=root.textContent||'',title=root.querySelector('.modal-head h2,.page-head h1')?.textContent||'',priority=title.includes('采购')?['purchases','procurements']:title.includes('开工')?['startApplications']:title.includes('付款')?['payments']:title.includes('事项')?['projectEvents']:title.includes('验收')?['finalAcceptances']:title.includes('归档')?['projectArchives']:['projects'];const rows=arrays(data).filter(({item})=>displayId(item)&&text.includes(displayId(item)));return rows.sort((a,b)=>(priority.includes(a.kind)?0:1)-(priority.includes(b.kind)?0:1))[0]||null};
    const resultText=value=>{const text=String(value||'');if(/退回|驳回|拒绝|不通过/.test(text))return['returned','已退回'];if(/通过|同意|完成|归档/.test(text))return['done','已通过'];if(/提交|发起|转交/.test(text))return['done','已提交'];if(/待|审批中|审核中/.test(text))return['current','待审批'];return['done',text||'已处理']};
    const recordRows=item=>{const pools=[item.records,item.approvalRecords,item.trace,item.operationLogs,item.logs].filter(Array.isArray),seen=new Set(),rows=[];pools.flat().forEach(record=>{const node=String(record.node||record.action||record.title||'').trim(),result=String(record.result||record.status||record.action||'').trim(),person=String(record.person||record.actor||record.operator||record.createdBy||record.side||'').trim(),opinion=String(record.opinion||record.note||record.remark||record.description||'').trim(),time=String(record.time||record.updatedAt||record.createdAt||record.date||'').trim();if(!/(提交|发起|审批|审核|会签|复核|退回|驳回|撤回|归档)/.test(node+result))return;const key=[node,result,person,time].join('|');if(seen.has(key))return;seen.add(key);rows.push({node,result,person,opinion,time,approvers:[]})});return rows};
    const configuredNodes=item=>{const snapshot=item.flowSnapshot||{},school=snapshot.schoolNodes||[],bureau=snapshot.bureauFlow?.nodes||snapshot.bureauNodes||[],nodes=[];school.forEach((node,scopeIndex)=>nodes.push({...node,scope:'school',scopeIndex}));bureau.forEach((node,scopeIndex)=>nodes.push({...node,scope:'bureau',scopeIndex}));return nodes};
    const buildSteps=item=>{const records=recordRows(item),steps=[];if(!records.some(row=>/提交|发起/.test((row.node||'')+row.result)))steps.push({node:'发起申请',result:'已提交',person:item.applicant||item.owner||item.createdBy||'申请人',opinion:'申请已提交并进入审批流程。',time:item.submittedAt||item.createdAt||item.created||'',approvers:[]});steps.push(...records);const configured=configuredNodes(item),recordNames=steps.map(row=>row.node||'').join('|'),activeScope=item.currentStage||(['SCHOOL_PENDING'].includes(item.status)?'school':['BUREAU_PENDING','BUREAU_PROCESSING','APPROVING'].includes(item.status)?'bureau':'');configured.forEach(node=>{if(!node.name||recordNames.includes(node.name))return;const isCurrent=item.currentNodeIndex===node.scopeIndex&&activeScope===node.scope;steps.push({node:node.name,result:isCurrent?'待审批':'未开始',person:'',opinion:'',time:'',approvers:node.approvers||[]})});const current=String(item.currentNode||'').trim();if(current&&current!=='—'&&!steps.some(row=>row.node===current))steps.push({node:current,result:'待审批',person:'',opinion:'',time:'',approvers:[]});return steps.length?steps:[{node:'',result:'待审批',person:'待处理',opinion:'暂无审批记录。',time:'',approvers:[]} ]};
    const actorHtml=(person,opinion,approvers,state)=>{const people=person?[person]:(approvers?.length?approvers:['待处理']);return `<div class="approval-flow-actors">${people.map(name=>`<div class="approval-flow-actor"><span class="approval-flow-avatar"><i class="${state==='current'?'ri-time-line':state==='returned'?'ri-close-line':'ri-user-3-line'}"></i></span><span class="approval-flow-actor-copy"><b>${escapeHtml(name)}</b><small>${state==='current'?'等待处理':state==='returned'?'已退回申请':'审批参与人'}</small></span></div>`).join('')}</div>${opinion?`<div class="approval-flow-opinion">${escapeHtml(opinion)}</div>`:''}`};
    const renderFlow=(item,label)=>{const steps=buildSteps(item);return `<section class="approval-flow-card" data-unified-approval-flow><div class="approval-flow-head"><h3>审批流程</h3><span>${escapeHtml(label||displayId(item))}</span></div><div class="approval-flow-rail">${steps.map(step=>{const [state,text]=resultText(step.result);return `<article class="approval-flow-node ${state}"><span class="approval-flow-marker"></span><div class="approval-flow-node-head">${step.node?`<strong>${escapeHtml(step.node)}</strong>`:''}<span class="approval-flow-state">${escapeHtml(text)}</span>${step.time?`<time class="approval-flow-time">${escapeHtml(step.time)}</time>`:''}</div>${actorHtml(step.person,step.opinion,step.approvers,state)}</article>`}).join('')}</div></section>`};
    const markLegacy=root=>{root.querySelectorAll('.timeline').forEach(line=>line.classList.add('approval-flow-legacy'));root.querySelectorAll('.form-title').forEach(title=>{if(/审批记录|审批轨迹|操作记录/.test(title.textContent))title.classList.add('approval-flow-legacy')})};
    const enhance=root=>{if(root.matches('[id^="p7"]')||root.querySelector('[id^="p7"]')||root.dataset.approvalFlowReady||root.querySelector('[data-unified-approval-flow]'))return;const text=root.textContent||'';if(!/(审批记录|审批轨迹|当前审批节点|当前节点|审批意见|同意|审批通过|退回|驳回)/.test(text))return;const data=read(),found=entityFor(root,data);if(!found)return;root.dataset.approvalFlowReady='1';root.classList.add('approval-flow-host');const body=root.matches('.unified-detail')?root:root.querySelector('.modal-body');if(!body)return;const anchor=body.querySelector('.notice,.detail-grid,.basic-grid,.form-title');anchor?anchor.insertAdjacentHTML('afterend',renderFlow(found.item,displayId(found.item))):body.insertAdjacentHTML('afterbegin',renderFlow(found.item,displayId(found.item)));markLegacy(root)};
    const scan=()=>{document.querySelectorAll('#modalRoot .modal,.unified-detail').forEach(enhance)};let queued=false;const observer=new MutationObserver(()=>{if(queued)return;queued=true;requestAnimationFrame(()=>{queued=false;scan()})});observer.observe(document.body,{childList:true,subtree:true});scan();document.documentElement.dataset.unifiedApprovalFlow='ready';

  <script>
  (()=>{
    const selector='#content .toolbar,#content .filter-grid,#content .p6-toolbar,#content .p7-toolbar';
    const cleanLabel=button=>(button.textContent||'').replace(/\s+/g,'').trim();
    const isExactAction=(button,type)=>{const label=cleanLabel(button);return type==='query'?/^(查询|筛选|搜索)$/.test(label):label==='重置'};
    const filterFields=root=>[...root.querySelectorAll('input:not([type="hidden"]):not([type="file"]),select')].filter(field=>!field.closest('.unified-filter-actions'));
    const isNestedCandidate=(root,candidates)=>candidates.some(candidate=>candidate!==root&&root.contains(candidate)&&filterFields(candidate).length);
    const addActions=root=>{
      if(root.querySelector('.unified-filter-actions')||filterFields(root).length===0)return;
      const buttons=[...root.querySelectorAll('button')];
      const nativeQuery=buttons.find(button=>isExactAction(button,'query'));
      const nativeReset=buttons.find(button=>isExactAction(button,'reset'));
      if(nativeQuery&&nativeReset)return;
      const actions=document.createElement('div');
      actions.className='unified-filter-actions';
      actions.dataset.unifiedFilterActions='';
      if(nativeQuery)actions.append(nativeQuery);
      else actions.insertAdjacentHTML('beforeend','<button type="button" class="btn primary" data-unified-filter-query><i class="ri-search-line"></i>查询</button>');
      if(nativeReset)actions.append(nativeReset);
      else actions.insertAdjacentHTML('beforeend','<button type="button" class="btn" data-unified-filter-reset>重置</button>');
      root.append(actions);
    };
    const scan=()=>{
      const candidates=[...document.querySelectorAll(selector)].filter(root=>!root.closest('#modalRoot'));
      candidates.filter(root=>!isNestedCandidate(root,candidates)).forEach(addActions);
    };
    const fire=(field,type)=>field.dispatchEvent(new Event(type,{bubbles:true}));
    const apply=root=>{
      const nativeQuery=[...root.querySelectorAll('button')].find(button=>!button.matches('[data-unified-filter-query],[data-unified-filter-reset]')&&isExactAction(button,'query'));
      if(nativeQuery){nativeQuery.click();return}
      filterFields(root).forEach(field=>{fire(field,'input');fire(field,'change')});
    };
    const reset=root=>{
      filterFields(root).forEach(field=>{
        if(field.tagName==='SELECT')field.selectedIndex=0;
        else if(field.type==='checkbox'||field.type==='radio')field.checked=false;
        else field.value='';
        fire(field,'input');fire(field,'change');
      });
    };
    document.addEventListener('click',event=>{
      const button=event.target.closest('[data-unified-filter-query],[data-unified-filter-reset]');
      if(!button)return;
      event.preventDefault();
      event.stopPropagation();
      const root=button.closest('.toolbar,.filter-grid,.p6-toolbar,.p7-toolbar');
      if(!root)return;
      button.matches('[data-unified-filter-query]')?apply(root):reset(root);
    },true);
    let pending=false;
    new MutationObserver(()=>{if(pending)return;pending=true;requestAnimationFrame(()=>{pending=false;scan()})}).observe(document.body,{childList:true,subtree:true});
    scan();
  })();
  </script>

    const isBureau=()=>document.querySelector('[data-p4-portal="bureau"].active,[data-portal="bureau"].active')||new URLSearchParams(location.search).get('portal')==='bureau';
    const cleanQuoteModal=()=>{
      if(!isBureau())return;
      document.querySelectorAll('#modalRoot .m8-modal-wide').forEach(modal=>{
        if(modal.id==='m8Query'){
          modal.querySelectorAll('[data-m8-view]').forEach(button=>button.textContent='查看报价');
          return;
        }
        const quoteView=modal.querySelector('.m8-overview,.m8-section');

        modal.querySelectorAll('table').forEach(table=>{
          const headers=[...table.querySelectorAll('thead th')];
          const operationIndex=headers.findIndex(cell=>cell.textContent.trim()==='操作');
          if(operationIndex<0)return;
          headers[operationIndex].remove();
          table.querySelectorAll('tbody tr').forEach(row=>{
            if(row.children[operationIndex])row.children[operationIndex].remove();
            const emptyCell=row.querySelector('td[colspan]');
            if(emptyCell)emptyCell.colSpan=Math.max(1,headers.length-1);
          });
        });
      });
    };
    let queued=false;
    new MutationObserver(()=>{if(queued)return;queued=true;requestAnimationFrame(()=>{queued=false;cleanQuoteModal()})}).observe(document.getElementById('modalRoot')||document.body,{childList:true,subtree:true});
    document.addEventListener('click',event=>{
      if(!isBureau())return;
      const blocked=event.target.closest('[data-m8-quote],[data-m8-void],[data-m8-quote-view],[data-m8-view]');

      if(!host||host.id==='m8Query')return;
      event.preventDefault();event.stopImmediatePropagation();
    },true);
    cleanQuoteModal();
  })();

      (data.payments||[]).filter(x=>x.status==='RETURNED').forEach(x=>addDelete(document.querySelector(`[data-p5-payment-view="${CSS.escape(x.id)}"]`)?.closest('.p5-inline-actions'),'data-p5-payment-delete',x.id));
      (data.startApplications||[]).filter(x=>x.status==='RETURNED').forEach(x=>addDelete(document.querySelector(`[data-p4-start-view="${CSS.escape(x.id)}"]`)?.closest('td'),'data-p4-start-delete',x.id));

    document.addEventListener('click',event=>{const button=event.target.closest('[data-p4-start-delete]');if(!button||!schoolApplicant())return;let data={};try{data=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{}const id=button.dataset.p4StartDelete,item=(data.startApplications||[]).find(x=>x.id===id);if(item?.status!=='RETURNED')return;event.preventDefault();event.stopImmediatePropagation();if(!confirm('确认删除被退回的开工申请？'))return;data.startApplications=data.startApplications.filter(x=>x.id!==id);localStorage.setItem(KEY,JSON.stringify(data));location.reload()},true);

  <script>
  (()=> {
    const modalRoot=document.getElementById('modalRoot');
    if(!modalRoot)return;

    const removeSectionByTitle=(body,title)=>{
      const heading=[...body.querySelectorAll('.form-title')].find(node=>node.textContent.trim().startsWith(title));
      if(!heading)return;
      if(heading.parentElement!==body){
        const wrapper=heading.parentElement;
        if(wrapper&&wrapper.parentElement===body)wrapper.remove();
        else heading.remove();
        return;
      }
      let node=heading;
      while(node){
        if(node!==heading&&node.classList.contains('form-title'))break;
        const next=node.nextElementSibling;
        node.remove();
        node=next;
      }
    };

    const cleanContractModal=()=>{
      const form=document.getElementById('p4ContractForm');
      if(form){
        const purchaseSummary=form.querySelector('#p4PurchaseSummary');
        if(purchaseSummary){
          purchaseSummary.hidden=true;
          purchaseSummary.replaceChildren();
        }
        form.querySelectorAll('[data-unified-approval-flow],.approval-flow-card').forEach(card=>{
          const text=card.textContent.trim();
          if(text.startsWith('审批流程')||card.hasAttribute('data-unified-approval-flow'))card.remove();
        });
        [...form.querySelectorAll('.form-title')].filter(title=>title.textContent.trim()==='审批流程').forEach(title=>{
          const card=title.closest('[data-unified-approval-flow],.approval-flow-card');
          if(card)card.remove();else title.remove();
        });
      }

      const modal=modalRoot.querySelector('.modal');
      const body=modal?.querySelector('.modal-body');
      const contractNo=modal?.querySelector('.modal-head small')?.textContent.trim()||'';
      if(!body||form||!/^HT-/.test(contractNo))return;

      body.querySelectorAll('[data-p4-project]').forEach(button=>{
        const text=document.createElement('span');
        text.textContent=button.textContent;
        button.replaceWith(text);
      });
      ['关联合同','关联开工申请','操作记录','付款与发票','付款申请','发票记录']
        .forEach(title=>removeSectionByTitle(body,title));
    };

    const cleanPurchaseDetail=()=>{
      const modal=modalRoot.querySelector('.modal');
      const body=modal?.querySelector('.modal-body');
      if(!body)return;
      const recordTitle=[...body.querySelectorAll('.form-title')]
        .find(title=>title.textContent.trim()==='采购审批与操作记录');
      if(recordTitle){
        const summary=body.querySelector('.summary-strip');
        if(summary&&!body.querySelector('[data-purchase-basic-title]')){
          const title=document.createElement('div');
          title.className='form-title';
          title.dataset.purchaseBasicTitle='1';
          title.textContent='采购基本信息';
          summary.before(title);
        }
        removeSectionByTitle(body,'采购审批与操作记录');
      }

      /* 第四阶段采购详情已由统一审批流程卡片展示流转，移除重复的审批记录表。 */
      const recordTable=body.querySelector('.p4-approval-record-table');
      if(recordTable){
        modal.dataset.purchaseDetail='1';
        const recordTitle=[...body.querySelectorAll('.form-title')]
          .find(title=>title.textContent.trim()==='审批记录');
        recordTitle?.remove();
        recordTable.closest('.table-wrap')?.remove();
      }
      if(modal.dataset.purchaseDetail==='1'){
        const basic=body.querySelector('.detail-grid');
        const flow=body.querySelector('[data-unified-approval-flow], .approval-flow-card');
        if(basic&&flow&&basic.nextElementSibling!==flow)basic.after(flow);
      }
    };

    /* 采购审批弹窗按“基本信息—审批流程—审批意见”展示，避免重复提示当前审批人。 */
    const cleanPurchaseApproval=()=>{
      const form=document.getElementById('p4PurchaseApprovalForm');
      const body=form?.querySelector('.modal-body');
      if(!body)return;
      body.querySelector('.notice')?.remove();
      const basic=body.querySelector('.detail-grid');
      const flow=body.querySelector('[data-unified-approval-flow], .approval-flow-card');
      if(basic&&flow&&basic.nextElementSibling!==flow)basic.after(flow);
    };

    const cleanMeetingModal=()=>{
      const form=document.getElementById('p4MeetingRecordForm');
      if(!form)return;
      const summary=form.querySelector('.detail-grid');
      if(summary?.querySelector('label')?.textContent.trim()==='项目编号')summary.remove();
      form.querySelectorAll('[data-unified-approval-flow], .approval-flow-card').forEach(card=>card.remove());
      const recordTitle=[...form.querySelectorAll('.form-title')]
        .find(title=>title.textContent.trim()==='记录信息');
      if(recordTitle)recordTitle.style.marginTop='0';
      const hint=form.querySelector('.modal-head small');
      if(hint)hint.textContent=hint.textContent.replace('可在项目任意阶段登记','项目审批通过后可登记');
    };

    /* 学校端业务编号由经办人手工填写，不提供自动生成入口。 */
    const cleanManualNumberInputs=()=>{
      const contractForm=document.getElementById('p4ContractForm');
      const paymentForm=document.getElementById('p5PaymentForm');
      [[contractForm,'no','合同编号'],[paymentForm,'no','付款申请编号']].forEach(([form,name,label])=>{
        if(!form)return;
        const input=form.querySelector(`[name="${name}"]`);
        if(!input)return;
        input.required=true;
        input.placeholder=`请输入${label}`;
        const field=input.closest('.field');
        field?.querySelector('label')?.classList.add('required');
      });
      contractForm?.querySelector('#p4AutoNo')?.remove();
      paymentForm?.querySelector('#p5GenNo')?.remove();
      const startForm=document.getElementById('p4StartForm');
      const startNo=startForm?.querySelector('[name="no"]');
      if(startNo){
        startNo.readOnly=false;
        startNo.required=true;
        startNo.placeholder='请输入开工申请编号';
        startNo.closest('.field')?.querySelector('label')?.classList.add('required');
        if(startForm.querySelector('.modal-head h2')?.textContent.includes('新建'))startNo.value='';
      }
    };

    const PAGE_SIZE=10;
    const paginateTables=()=>{
      document.querySelectorAll('#content .table-wrap > table').forEach((table,index)=>{
        const wrap=table.parentElement,body=table.tBodies[0];
        if(!wrap||!body)return;
        const rows=[...body.rows].filter(row=>row.cells.length&&!row.querySelector('td[colspan]'));
        const old=wrap.nextElementSibling;
        if(old?.matches('.prototype-pagination'))old.remove();
        if(!rows.length)return;
        const totalPages=Math.max(1,Math.ceil(rows.length/PAGE_SIZE));
        let current=Math.min(Math.max(Number(table.dataset.page||1),1),totalPages);
        table.dataset.page=String(current);
        rows.forEach((row,rowIndex)=>{row.hidden=Math.floor(rowIndex/PAGE_SIZE)+1!==current});
        const pager=document.createElement('div');
        pager.className='prototype-pagination';
        const pageButtons=Array.from({length:totalPages},(_,pageIndex)=>{
          const page=pageIndex+1;
          return `<button class="btn pagination-number ${page===current?'active':''}" data-table-page="${index}" data-page="${page}" ${page===current?'disabled':''}>${page}</button>`;
        }).join('');
        pager.innerHTML=`<span>共 ${rows.length} 条</span><button class="btn" data-table-page="${index}" data-page="${current-1}" ${current===1?'disabled':''}>上一页</button>${pageButtons}<button class="btn" data-table-page="${index}" data-page="${current+1}" ${current===totalPages?'disabled':''}>下一页</button>`;
        wrap.after(pager);
      });
    };
    document.addEventListener('click',event=>{
      const button=event.target.closest('[data-table-page]');
      if(!button||button.disabled)return;
      const tables=[...document.querySelectorAll('#content .table-wrap > table')];
      const table=tables[Number(button.dataset.tablePage)];
      if(!table)return;
      table.dataset.page=button.dataset.page;
      paginateTables();
    });
    const contentRoot=document.getElementById('content');
    if(contentRoot){
      let paginationQueued=false;
      new MutationObserver(mutations=>{
        const onlyPagerChanges=mutations.every(m=>[...m.addedNodes,...m.removedNodes]
          .every(node=>node.nodeType===1&&node.classList?.contains('prototype-pagination')));
        if(onlyPagerChanges||paginationQueued)return;
        paginationQueued=true;
        requestAnimationFrame(()=>{paginationQueued=false;paginateTables()});
      }).observe(contentRoot,{childList:true,subtree:true});
    }

    let queued=false;
    const observer=new MutationObserver(()=>{
      if(queued)return;
      queued=true;
      requestAnimationFrame(()=>{
        queued=false;
        cleanContractModal();
        cleanPurchaseDetail();
        cleanPurchaseApproval();
        cleanMeetingModal();
        cleanManualNumberInputs();
        paginateTables();
      });
    });
    observer.observe(modalRoot,{childList:true,subtree:true});
    cleanContractModal();
    cleanPurchaseDetail();
    cleanPurchaseApproval();
    cleanMeetingModal();
    cleanManualNumberInputs();
    paginateTables();
  })();
  </script>
