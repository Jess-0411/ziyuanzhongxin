  <script>
  (()=> {
    const root=document.getElementById('modalRoot');
    if(!root)return;
    const extension=/([^\s\\/:*?"<>|]+?\.(?:pdf|docx?|xlsx?|pptx?|png|jpe?g|gif|webp|zip|rar|7z|txt|csv|dwg))/i;
    const encode=file=>encodeURIComponent(JSON.stringify(file));
    const decode=value=>{try{return JSON.parse(decodeURIComponent(value||''))}catch{return{}}};
    const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));
    const sizeText=size=>{const n=Number(size||0);return n?n<1024?`${n} B`:n<1048576?`${(n/1024).toFixed(1)} KB`:`${(n/1048576).toFixed(1)} MB`:'未知大小'};
    const fileFrom=node=>{
      const text=(node.textContent||'').replace(/\s+/g,' ').trim(),match=text.match(extension);
      if(!match)return null;
      const sizeMatch=text.match(/(\d+(?:\.\d+)?)\s*(KB|MB|B)/i);
      const unit=sizeMatch?.[2]?.toUpperCase(),amount=Number(sizeMatch?.[1]||0);
      const size=unit==='MB'?amount*1048576:unit==='KB'?amount*1024:amount;
      return{name:match[1].trim(),size,type:'附件'};
    };
    const semanticRow=node=>node.closest('.file-row,.file-chip,.p4-file,.p5-relation,.rule,.p4-file-item,.attachment-row,.meeting-attachment,.m8-file-row,tr')||node.parentElement;
    const ensureActions=(row,file)=>{
      if(!row||row.closest('.modal-head')||row.dataset.globalFileEnhanced==='true')return;
      const currentView=row.querySelector('[data-p4-scheme-preview],[data-unified-file-preview],[data-global-file-view]');
      const currentDownload=row.querySelector('[data-p4-scheme-download],[data-global-file-download]');
      if(currentView)currentView.textContent='查看';
      if(currentDownload)currentDownload.textContent='下载';
      const actions=document.createElement('span');
      actions.className='global-file-actions';
      if(!currentView)actions.insertAdjacentHTML('beforeend',`<button type="button" class="btn link" data-global-file-view="${encode(file)}">查看</button>`);
      if(!currentDownload)actions.insertAdjacentHTML('beforeend',`<button type="button" class="btn link" data-global-file-download="${encode(file)}">下载</button>`);
      if(actions.children.length)row.append(actions);
      row.dataset.globalFileEnhanced='true';
    };
    const enhancePreviewModal=modal=>{
      if(modal.querySelector('.modal-head h2')?.textContent.trim()!=='附件预览')return false;
      const file=fileFrom(modal.querySelector('.modal-body')||modal)||{name:'附件',size:0,type:'附件'};
      const body=modal.querySelector('.modal-body');
      if(body&&!body.querySelector('.global-file-preview'))body.innerHTML=`<div class="global-file-preview"><i class="ri-file-search-line"></i><div><b>${esc(file.name)}</b><span>文件类型：${esc(file.type||'附件')}<br>文件大小：${sizeText(file.size)}<br>当前为交互原型，展示文件元数据预览。</span></div></div>`;
      const foot=modal.querySelector('.modal-foot');
      if(foot&&!foot.querySelector('[data-global-file-download],[data-p4-scheme-download]'))foot.insertAdjacentHTML('beforeend',`<button type="button" class="btn primary" data-global-file-download="${encode(file)}">下载</button>`);
      return true;
    };
    const enhance=()=>{
      root.querySelectorAll('.modal-head small').forEach(note=>note.remove());
      root.querySelectorAll('.modal').forEach(modal=>{
        if(enhancePreviewModal(modal))return;
        const candidates=new Set;
        modal.querySelectorAll('.file-row,.file-chip,.p4-file,.p5-relation,.rule,.p4-file-item,.attachment-row,.meeting-attachment,.m8-file-row,tr').forEach(node=>{if(fileFrom(node))candidates.add(node)});
        modal.querySelectorAll('b,strong,span,td').forEach(node=>{if(fileFrom(node))candidates.add(semanticRow(node))});
        candidates.forEach(row=>{const file=fileFrom(row);if(file)ensureActions(row,file)});
      });
    };
    const showPreview=file=>{
      root.innerHTML=`<div class="modal-mask"><div class="modal"><div class="modal-head"><div><h2>附件预览</h2></div><button class="close" data-p4-close>×</button></div><div class="modal-body"><div class="global-file-preview"><i class="ri-file-search-line"></i><div><b>${esc(file.name||'附件')}</b><span>文件类型：${esc(file.type||'附件')}<br>文件大小：${sizeText(file.size)}<br>当前为交互原型，展示文件元数据预览。</span></div></div></div><div class="modal-foot"><button type="button" class="btn" data-p4-close>关闭</button><button type="button" class="btn primary" data-global-file-download="${encode(file)}">下载</button></div></div></div>`;
    };
    const download=file=>{
      const name=file.name||'附件.txt',content=`教育项目全过程管理系统原型附件\n文件名称：${name}\n文件类型：${file.type||'附件'}\n说明：当前交互原型仅保存文件元数据。`;
      const url=URL.createObjectURL(new Blob([content],{type:'text/plain;charset=utf-8'})),anchor=document.createElement('a');
      anchor.href=url;anchor.download=name;document.body.append(anchor);anchor.click();anchor.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
      const host=document.getElementById('toasts');if(host){const tip=document.createElement('div');tip.className='toast';tip.innerHTML='<i class="ri-download-2-line"></i><span>附件已开始下载</span>';host.append(tip);setTimeout(()=>tip.remove(),3000)}
    };
    document.addEventListener('click',event=>{
      const view=event.target.closest('[data-global-file-view]'),save=event.target.closest('[data-global-file-download]');
      if(!view&&!save)return;
      event.preventDefault();event.stopImmediatePropagation();
      if(view)showPreview(decode(view.dataset.globalFileView));
      else download(decode(save.dataset.globalFileDownload));
    },true);
    let queued=false;
    new MutationObserver(()=>{if(queued)return;queued=true;requestAnimationFrame(()=>{queued=false;enhance()})}).observe(root,{childList:true,subtree:true});
    enhance();
  })();
  </script>

<script>
(() => {
  const removeSection = (root, title) => {
    const heading = [...root.querySelectorAll('.form-title')].find(node => node.textContent.trim() === title);
    if (!heading || heading.dataset.invoiceRemoved) return;
    heading.dataset.invoiceRemoved = '1';
    let node = heading;
    while (node) {
      const next = node.nextElementSibling;
      node.remove();
      if (!next || next.classList.contains('form-title')) break;
      node = next;

  };
  const enhanceInvoiceDetail = () => {

  const enhanceLinkModal = () => {
    const form = document.getElementById('p5LinkForm');
    if (!form) return;
    const toolbar = form.querySelector('.toolbar');
    if (toolbar && !form.querySelector('#p5LinkQuery')) {
      toolbar.insertAdjacentHTML('beforeend', '<button type="button" class="btn" id="p5LinkQuery">查询</button><button type="button" class="btn" id="p5LinkReset">重置</button>');
      document.getElementById('p5LinkQuery').onclick = () => document.getElementById('p5LinkPaymentName')?.dispatchEvent(new Event('input'));
      document.getElementById('p5LinkReset').onclick = () => {
        const name = document.getElementById('p5LinkPaymentName'), project = document.getElementById('p5LinkPaymentProject');
        if (name) name.value = '';
        if (project) project.value = '';
        name?.dispatchEvent(new Event('input'));
      };
    }
    const table = form.querySelector('#p5LinkPaymentTable table');
    if (!table || table.dataset.radioReady) return;
    table.dataset.radioReady = '1';
    const header = table.querySelector('thead tr');
    const operationIndex = [...header.cells].findIndex(cell => cell.textContent.trim() === '操作');
    if (operationIndex < 0) return;
    const hiddenActions = document.createElement('div');

    table.querySelectorAll('tbody tr').forEach(row => {
      const action = row.cells[operationIndex]?.querySelector('[data-p5-link-select]');

    modalRoot.innerHTML=`<div class="system-confirm-mask"><div class="system-confirm" role="dialog" aria-modal="true" aria-labelledby="systemConfirmTitle"><div class="system-confirm-head"><h2 id="systemConfirmTitle">${esc(settings.title)}</h2><button type="button" class="system-confirm-x" data-system-confirm-cancel>×</button></div><div class="system-confirm-body"><div class="system-confirm-icon">!</div><div class="system-confirm-copy"><b>${esc(settings.message)}</b>${settings.description?`<p>${esc(settings.description)}</p>`:''}</div></div><div class="system-confirm-actions"><button type="button" class="btn" data-system-confirm-cancel>${esc(settings.cancelText)}</button><button type="button" class="btn ${settings.danger?'danger':'primary'}" data-system-confirm-ok>${esc(settings.confirmText)}</button></div></div></div>`;
    const finish=result=>{modalRoot.innerHTML='';resolve(result)};
    modalRoot.querySelectorAll('[data-system-confirm-cancel]').forEach(button=>button.onclick=()=>finish(false));
    modalRoot.querySelector('[data-system-confirm-ok]').onclick=()=>finish(true);
  });

  const latestQuotes=materialId=>{
    const rows=read(QUOTE_KEY).filter(row=>row.materialId===materialId&&row.status!=='VOIDED').sort((a,b)=>String(b.quoteDate||b.createdAt).localeCompare(String(a.quoteDate||a.createdAt)));
    const suppliers=new Map;
    rows.forEach(row=>{if(!suppliers.has(row.supplierName))suppliers.set(row.supplierName,row)});
    return [...suppliers.values()];
  };

  function showMaterialDetail(materialId){
    const material=read(MATERIAL_KEY).find(row=>row.id===materialId);
    if(!material)return toast('未找到材料信息，请刷新后重试',true);
    modalRoot.innerHTML='';
    const quotes=latestQuotes(materialId);
    content.innerHTML=`<div class="material-detail-page"><div class="page-head"><div><h1>材料详情</h1></div><div class="head-actions"><button class="btn" data-material-detail-back><i class="ri-arrow-left-line"></i>返回材料价格库</button><button class="btn" data-m8-edit="${esc(material.id)}">编辑材料</button><button class="btn primary" data-m8-quote="${esc(material.id)}" ${material.status!=='ENABLED'?'disabled':''}><i class="ri-add-line"></i>新增报价</button></div></div><div class="card material-detail-card"><div class="card-head"><h2>材料基础信息</h2><span class="tag ${material.status==='ENABLED'?'green':'gray'}">${material.status==='ENABLED'?'启用':'停用'}</span></div><div class="material-detail-grid"><div class="material-detail-field"><label>材料ID</label><b>${esc(material.id)}</b></div><div class="material-detail-field"><label>材料编号</label><b>${esc(material.code||'—')}</b></div><div class="material-detail-field"><label>材料名称</label><b>${esc(material.name||'—')}</b></div><div class="material-detail-field"><label>材料分类</label><span>${esc(material.category||'—')}</span></div><div class="material-detail-field"><label>材料类型</label><span>${esc(material.type||'—')}</span></div><div class="material-detail-field"><label>品牌</label><span>${esc(material.brand||'—')}</span></div><div class="material-detail-field"><label>规格型号</label><span>${esc(material.specification||'—')}</span></div><div class="material-detail-field"><label>材质</label><span>${esc(material.material||'—')}</span></div><div class="material-detail-field"><label>计价单位</label><span>${esc(material.unit||'—')}</span></div><div class="material-detail-field"><label>参考图片</label><span>${esc(material.image?.name||'未选择参考图片')}</span></div><div class="material-detail-field"><label>使用状态</label><span>${material.status==='ENABLED'?'启用':'停用'}</span></div><div class="material-detail-field"><label>创建时间</label><span>${esc(material.createdAt||'—')}</span></div><div class="material-detail-field"><label>更新时间</label><span>${esc(material.updatedAt||'—')}</span></div><div class="material-detail-field full"><label>技术参数</label><span>${esc(material.technicalParameters||'—')}</span></div><div class="material-detail-field full"><label>适用场景</label><span>${esc(material.applicableScenario||'—')}</span></div><div class="material-detail-field full"><label>备注</label><span>${esc(material.remark||'—')}</span></div></div></div><div class="card material-current-quotes"><div class="card-head"><h2>当前报价</h2><span>按供应商显示最新一条未作废报价</span></div><div class="table-wrap"><table><thead><tr><th>供应商名称</th><th>材料单价</th><th>计价单位</th><th>是否含税</th><th>安装费用</th><th>运输费用</th><th>报价地区</th><th>报价日期</th><th>有效期</th><th>报价状态</th><th>操作</th></tr></thead><tbody>${quotes.length?quotes.map(quote=>`<tr><td><b>${esc(quote.supplierName)}</b></td><td class="m8-price">${Number(quote.unitPrice||0).toFixed(2)} 元</td><td>${esc(quote.unit||material.unit||'—')}</td><td>${quote.taxIncluded?'含税':'不含税'}</td><td>${esc(feeMode(quote.installationMode,quote.installationFee,'安装'))}</td><td>${esc(feeMode(quote.transportMode,quote.transportFee,'运输'))}</td><td>${esc(quote.region||'—')}</td><td>${esc(quote.quoteDate||'—')}</td><td>${esc(quote.validFrom||'—')} 至 ${esc(quote.validTo||'—')}</td><td><span class="tag ${statusClass(quote)}">${statusOf(quote)}</span></td><td><button class="btn link" data-material-quote-readonly="${esc(quote.id)}">查看详情</button></td></tr>`).join(''):`<tr><td colspan="11"><div class="m8-empty">暂无当前报价，可点击“新增报价”登记供应商报价。</div></td></tr>`}</tbody></table></div></div></div>`;
    document.querySelectorAll('.nav-btn').forEach(button=>button.classList.toggle('active',button.hasAttribute('data-m8-nav')));
  }

  function showQuoteReadonly(quoteId){
    const quote=read(QUOTE_KEY).find(row=>row.id===quoteId),material=read(MATERIAL_KEY).find(row=>row.id===quote?.materialId);
    if(!quote||!material)return toast('未找到报价记录，请刷新后重试',true);
    const files=Array.isArray(quote.attachments)?quote.attachments:[];
    modalRoot.innerHTML=`<div class="modal-mask"><div class="modal material-readonly-modal"><div class="modal-head"><div><h2>报价详情</h2><small>只读信息，不支持编辑</small></div><button type="button" class="close" data-material-quote-close>×</button></div><div class="modal-body"><div class="material-readonly-grid"><div class="material-readonly-item"><label>报价ID</label><b>${esc(quote.id)}</b></div><div class="material-readonly-item"><label>材料ID</label><span>${esc(quote.materialId)}</span></div><div class="material-readonly-item"><label>材料名称</label><span>${esc(material.name)}</span></div><div class="material-readonly-item"><label>供应商名称</label><b>${esc(quote.supplierName)}</b></div><div class="material-readonly-item"><label>供应商联系人</label><span>${esc(quote.contactName||'—')}</span></div><div class="material-readonly-item"><label>联系电话</label><span>${esc(quote.contactPhone||'—')}</span></div><div class="material-readonly-item"><label>材料单价</label><b>${Number(quote.unitPrice||0).toFixed(2)} 元</b></div><div class="material-readonly-item"><label>计价单位</label><span>${esc(quote.unit||material.unit||'—')}</span></div><div class="material-readonly-item"><label>是否含税</label><span>${quote.taxIncluded?'含税':'不含税'}</span></div><div class="material-readonly-item"><label>税率</label><span>${quote.taxIncluded?Number(quote.taxRate||0).toFixed(2)+'%':'—'}</span></div><div class="material-readonly-item"><label>安装费用方式</label><span>${esc(feeMode(quote.installationMode,quote.installationFee,'安装'))}</span></div><div class="material-readonly-item"><label>安装费</label><span>${Number(quote.installationFee||0).toFixed(2)} 元</span></div><div class="material-readonly-item"><label>运输费用方式</label><span>${esc(feeMode(quote.transportMode,quote.transportFee,'运输'))}</span></div><div class="material-readonly-item"><label>运输费</label><span>${Number(quote.transportFee||0).toFixed(2)} 元</span></div><div class="material-readonly-item"><label>报价地区</label><span>${esc(quote.region||'—')}</span></div><div class="material-readonly-item"><label>报价日期</label><span>${esc(quote.quoteDate||'—')}</span></div><div class="material-readonly-item"><label>有效期开始日期</label><span>${esc(quote.validFrom||'—')}</span></div><div class="material-readonly-item"><label>有效期结束日期</label><span>${esc(quote.validTo||'—')}</span></div><div class="material-readonly-item"><label>报价来源</label><span>${esc(quote.source||'—')}</span></div><div class="material-readonly-item"><label>报价状态</label><span class="tag ${statusClass(quote)}">${statusOf(quote)}</span></div><div class="material-readonly-item"><label>创建时间</label><span>${esc(quote.createdAt||'—')}</span></div><div class="material-readonly-item full"><label>报价附件</label>${files.length?files.map(file=>`<div class="material-quote-file"><i class="ri-attachment-2"></i><span>${esc(file.name)} · ${(Number(file.size||0)/1024).toFixed(1)} KB · ${esc(file.type||'附件')}</span></div>`).join(''):'<span>无附件</span>'}</div><div class="material-readonly-item full"><label>备注</label><span>${esc(quote.remark||'—')}</span></div></div></div><div class="modal-foot"><button type="button" class="btn primary" data-material-quote-close>关闭</button></div></div></div>`;
  }

  async function toggleMaterial(materialId){
    const rows=read(MATERIAL_KEY),material=rows.find(row=>row.id===materialId);
    if(!material)return;
    const disabling=material.status==='ENABLED',verb=disabling?'停用':'启用';
    const confirmed=await window.educationConfirm({title:`确认${verb}`,message:`确认要${verb}么？`,description:disabling?'停用后不能新增报价，已有材料和报价数据仍会保留。':'启用后可继续维护供应商报价。',confirmText:`确认${verb}`,danger:disabling});
    if(!confirmed)return;
    material.status=disabling?'DISABLED':'ENABLED';material.updatedAt=now();write(MATERIAL_KEY,rows);addLog(material.id,verb+'材料',material.name,verb+'材料使用状态');toast(`材料已${verb}`);document.querySelector('[data-m8-nav]')?.click();
  }

  async function deleteMaterial(materialId){
    const materials=read(MATERIAL_KEY),material=materials.find(row=>row.id===materialId);
    if(!material)return;
    if(read(QUOTE_KEY).some(quote=>quote.materialId===materialId))return toast('该材料已存在供应商报价，为保留价格数据不能删除，请使用停用操作。',true);
    const confirmed=await window.educationConfirm({title:'确认删除',message:'确认要删除么？',description:'删除后不可恢复。',confirmText:'确认删除',danger:true});
    if(!confirmed)return;
    write(MATERIAL_KEY,materials.filter(row=>row.id!==materialId));addLog(materialId,'删除材料',material.name,'删除无报价记录的材料');toast('材料已删除');document.querySelector('[data-m8-nav]')?.click();
  }

  const enhanceMaterialActions=()=>{
    document.querySelectorAll('[data-m8-view]').forEach(button=>{button.dataset.materialDetailPage=button.dataset.m8View;button.removeAttribute('data-m8-view')});
    document.querySelectorAll('[data-m8-quote-view]').forEach(button=>{button.dataset.materialQuoteReadonly=button.dataset.m8QuoteView;button.removeAttribute('data-m8-quote-view')});
    document.querySelectorAll('[data-m8-toggle]').forEach(button=>{button.dataset.systemMaterialToggle=button.dataset.m8Toggle;button.removeAttribute('data-m8-toggle')});
    document.querySelectorAll('[data-m8-delete]').forEach(button=>{button.dataset.systemMaterialDelete=button.dataset.m8Delete;button.removeAttribute('data-m8-delete')});
  };

  document.addEventListener('click',event=>{
    const detail=event.target.closest('[data-material-detail-page]'),quote=event.target.closest('[data-material-quote-readonly]'),back=event.target.closest('[data-material-detail-back]'),toggle=event.target.closest('[data-system-material-toggle]'),remove=event.target.closest('[data-system-material-delete]'),close=event.target.closest('[data-material-quote-close]');
    if(detail){event.preventDefault();event.stopImmediatePropagation();showMaterialDetail(detail.dataset.materialDetailPage);return}
    if(quote){event.preventDefault();event.stopImmediatePropagation();showQuoteReadonly(quote.dataset.materialQuoteReadonly);return}
    if(back){event.preventDefault();event.stopImmediatePropagation();document.querySelector('[data-m8-nav]')?.click();return}
    if(toggle){event.preventDefault();event.stopImmediatePropagation();toggleMaterial(toggle.dataset.systemMaterialToggle);return}
    if(remove){event.preventDefault();event.stopImmediatePropagation();deleteMaterial(remove.dataset.systemMaterialDelete);return}
    if(close){event.preventDefault();event.stopImmediatePropagation();modalRoot.innerHTML=''}
  },true);

  let queued=false;
  new MutationObserver(()=>{if(queued)return;queued=true;queueMicrotask(()=>{queued=false;enhanceMaterialActions()})}).observe(document.body,{childList:true,subtree:true});
  window.showMaterialDetailPage=showMaterialDetail;
  enhanceMaterialActions();
})();
</script>

<script>
(()=>{
  const DATA_KEY='edu-project-phase2-demo-v2';
  try{
    const data=JSON.parse(localStorage.getItem(DATA_KEY)||'{}');
    if(!data.archiveMultipleSubmissionsV1&&Array.isArray(data.projectArchives)){
      data.projectArchives.filter(item=>['PENDING_SCHOOL_APPROVAL','PENDING_BUREAU_CONFIRMATION','RETURNED','ARCHIVED'].includes(item.archiveStatus)).forEach((item,index)=>{
        item.supplementDocuments=Array.isArray(item.supplementDocuments)?item.supplementDocuments:[];
        const seeds=[
          {id:`AS-HISTORY-${index}-01`,note:'首次提交项目归档资料，已整理项目总结及全过程业务附件。',files:[{name:'项目归档资料汇总.pdf',size:235520,type:'application/pdf'}],uploader:'张老师',uploadedAt:'2026-07-20 09:30'},
          {id:`AS-HISTORY-${index}-02`,note:'根据校内审核意见，补充最终验收签章页和合同履约说明。',files:[{name:'最终验收签章页.pdf',size:184320,type:'application/pdf'},{name:'合同履约情况说明.docx',size:96256,type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'}],uploader:'张老师',uploadedAt:'2026-07-21 15:10'},
          {id:`AS-HISTORY-${index}-03`,note:'已完成最后一次核对并补充项目总结，请审批归档。',files:[{name:'项目总结及验收签章页.pdf',size:286720,type:'application/pdf'}],uploader:'张老师',uploadedAt:item.submittedAt||'2026-07-22 10:20'}
        ];
        seeds.forEach(seed=>{if(!item.supplementDocuments.some(doc=>doc.id===seed.id))item.supplementDocuments.push(seed)});
      });
      data.archiveMultipleSubmissionsV1=true;
      localStorage.setItem(DATA_KEY,JSON.stringify(data));
    }
  }catch{}
  const normalizeRejectButtons=()=>{
    document.querySelectorAll('button').forEach(button=>{
      const text=button.textContent.trim();
      if(text==='退回申请人')button.innerHTML=button.querySelector('i')?`${button.querySelector('i').outerHTML}驳回`:'驳回';
    });
  };
  const normalizeArchiveSubmission=()=>{
    document.querySelectorAll('#p7SchoolApprove,#p7Confirm').forEach(form=>{
      const currentActor=form.querySelector('.approval-flow-node.current .approval-flow-actor-copy b');
      const expectedActor=form.id==='p7SchoolApprove'?'学校项目管理员':'教育局项目管理员';
      if(currentActor&&currentActor.textContent!==expectedActor)currentActor.textContent=expectedActor;
      const card=form.querySelector('.record-card');
      if(!card||card.dataset.archiveSubmissionNormalized)return;
      const person=card.querySelector('.record-head .tag')?.textContent.trim()||'—';
      const time=card.querySelector('.record-head time')?.textContent.trim()||'—';
      const note=card.querySelector('.record-head')?.nextElementSibling?.textContent.trim()||'—';
      const attachments=card.querySelector('.meeting-attachments')?.innerHTML||'<div class="empty">本次提交未上传补充附件</div>';
      card.dataset.archiveSubmissionNormalized='1';
      card.classList.add('archive-submission-card');
      card.previousElementSibling?.classList.add('archive-submission-title');
      card.innerHTML=`<div class="archive-submission-meta"><div class="archive-meta-item"><span class="archive-meta-icon"><i class="ri-user-3-line"></i></span><div><label>提交人</label><b>${person}</b></div></div><div class="archive-meta-item"><span class="archive-meta-icon"><i class="ri-time-line"></i></span><div><label>提交时间</label><b>${time}</b></div></div></div><div class="archive-submission-section"><div class="archive-section-label"><i class="ri-file-text-line"></i><span>完善／补充说明</span></div><div class="archive-note">${note}</div></div><div class="archive-submission-section archive-files-section"><div class="archive-section-label"><i class="ri-attachment-2"></i><span>补充附件</span></div><div class="meeting-attachments">${attachments}</div></div>`;
    });
  };
  const normalizeArchiveSubmitRequired=()=>{
    const form=document.querySelector('#p7Submit');
    if(!form)return;
    const note=form.querySelector('textarea[name="note"]'),noteLabel=note?.closest('.field')?.querySelector('label');
    const confirmInput=form.querySelector('input[name="confirm"]'),confirmText=confirmInput?.closest('label')?.querySelector('span');
    if(note)note.required=true;
    if(confirmInput)confirmInput.required=true;
    noteLabel?.querySelector('.p7-required-mark')?.remove();
    confirmText?.querySelector('.p7-required-mark')?.remove();
    noteLabel?.classList.add('required');
    confirmText?.classList.add('required');
  };

<script>
(() => {
  const requiredRules={
    approvalForm:['person'],
    purchaseApprovalForm:['person'],
    nodeForm:['method','returnMode'],
    flowForm:['min'],
    p4PurchaseForm:['method'],
    m8QuoteForm:['installationMode','transportMode']
  };

  const fieldLabel=(form,control)=>{
    const field=control.closest('.field');
    if(field){
      const labels=[...field.children].filter(node=>node.tagName==='LABEL');
      if(labels.length)return labels[0]
    }
    if(control.id){
      const linked=form.querySelector(`label[for="${CSS.escape(control.id)}"]`);
      if(linked)return linked
    }
    return null
  };

  const markRequired=(label,control)=>{
    if(!label)return;
    label.classList.add('required');
    label.dataset.required='true';
    control?.setAttribute('aria-required','true');
    if(label.firstChild?.nodeType===Node.TEXT_NODE){
      label.firstChild.nodeValue=label.firstChild.nodeValue.replace(/^\s*\*\s*/,'')
    }
  };

  const enhanceRequiredMarks=()=>{
    document.querySelectorAll('#modalRoot form').forEach(form=>{
      form.querySelectorAll('label.required,label[data-required="true"]').forEach(label=>{
        const field=label.closest('.field');
        const control=field?.querySelector('input:not([type="hidden"]),select,textarea');
        markRequired(label,control)
      });
      form.querySelectorAll('input[required],select[required],textarea[required],[aria-required="true"]').forEach(control=>markRequired(fieldLabel(form,control),control));
      (requiredRules[form.id]||[]).forEach(name=>{
        const control=form.elements.namedItem(name);
        if(control instanceof HTMLElement)markRequired(fieldLabel(form,control),control)
      })
    })
  };

  let queued=false;
  new MutationObserver(()=>{
    if(queued)return;
    queued=true;
    queueMicrotask(()=>{queued=false;enhanceRequiredMarks()})
  }).observe(document.getElementById('modalRoot'),{childList:true,subtree:true});
  enhanceRequiredMarks();
})();
</script>
<script>
(()=>{
  const MAX_UPLOAD_FILES=5;
  const MAX_UPLOAD_SIZE=15*1024*1024;
  const UPLOAD_ACCEPT='.pdf,.doc,.docx,.xls,.xlsx,.png,.jng,.jpg,.jpeg';
  const UPLOAD_HELP='最多上传 5 个文件，单个文件最大 15 MB。支持 PDF、Word、Excel、PNG、JNG（兼容 JPG/JPEG）。';
  const uploadToast=(message)=>{
    if(typeof toast==='function'){toast(message,true);return}
    const host=document.querySelector('#toasts')||document.body;
    const tip=document.createElement('div');
    tip.className='toast error';
    tip.textContent=message;
    host.append(tip);
    setTimeout(()=>tip.remove(),3600)
  };
  const normalizeUploadRules=()=>{
    document.querySelectorAll('input[type="file"]').forEach(input=>{
      if(!input.accept||input.accept!==UPLOAD_ACCEPT)input.accept=UPLOAD_ACCEPT;
      const approvalForm=input.closest('form[id*="approval" i],form[id*="approve" i]');
      if(approvalForm){
        const existingHelp=input.nextElementSibling;
        if(existingHelp?.classList.contains('project-upload-rule'))existingHelp.remove();
        return
      }
      let help=input.nextElementSibling;
      if(!help?.classList.contains('project-upload-rule')){
        help=document.createElement('small');
        help.className='project-upload-rule';
        input.insertAdjacentElement('afterend',help)
      }
      if(help.textContent!==UPLOAD_HELP)help.textContent=UPLOAD_HELP
    });
    document.querySelectorAll('#modalRoot form[id*="approval" i] .project-upload-rule,#modalRoot form[id*="approve" i] .project-upload-rule').forEach(help=>help.remove());
    document.querySelectorAll('.project-upload-rule,.field-help,.p4-muted,.p5-form-note').forEach(help=>{
      if(/115\s*MB/i.test(help.textContent||''))help.textContent=(help.textContent||'').replace(/115\s*MB/gi,'15 MB')
    })
  };
  document.addEventListener('change',event=>{
    const input=event.target;
    if(!(input instanceof HTMLInputElement)||input.type!=='file')return;
    const files=[...(input.files||[])];
    const oversize=files.find(file=>file.size>MAX_UPLOAD_SIZE);
    if(files.length<=MAX_UPLOAD_FILES&&!oversize)return;
    event.preventDefault();
    event.stopImmediatePropagation();
    input.value='';
    uploadToast(files.length>MAX_UPLOAD_FILES?'最多只能上传 5 个文件，请重新选择。':`文件“${oversize.name}”超过 15 MB，请重新选择。`)
  },true);
  let uploadNormalizeQueued=false;
  new MutationObserver(()=>{
    if(uploadNormalizeQueued)return;
    uploadNormalizeQueued=true;
    queueMicrotask(()=>{uploadNormalizeQueued=false;normalizeUploadRules()})
  }).observe(document.body,{childList:true,subtree:true});
  normalizeUploadRules()
})();
</script>
<script>
(() => {
  const MATERIAL_KEY='project_materials',LOG_KEY='project_material_logs';
  const modalRoot=document.getElementById('modalRoot');
  const read=(key)=>{try{const value=JSON.parse(localStorage.getItem(key)||'[]');return Array.isArray(value)?value:[]}catch{return[]}};
  const write=(key,value)=>localStorage.setItem(key,JSON.stringify(value));
  const now=()=>new Date().toLocaleString('zh-CN',{hour12:false}).replaceAll('/','-');
  const actor=()=>document.getElementById('actorName')?.textContent.trim()||'教育局管理员';
  const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));
  const toast=(message,error=false)=>{const host=document.getElementById('toasts')||document.body,tip=document.createElement('div');tip.className='toast'+(error?' error':'');tip.innerHTML=`<i class="${error?'ri-error-warning-line':'ri-checkbox-circle-line'}"></i><span>${esc(message)}</span>`;host.append(tip);setTimeout(()=>tip.remove(),3200)};
  let pendingMaterialEditId='';

  const refreshMaterialList=()=>document.querySelector('[data-m8-nav]')?.click();

  const addLog=(materialId,action,object,note)=>{
    const rows=read(LOG_KEY);
    rows.unshift({id:'log_'+Date.now(),materialId,action,object,operator:actor(),time:now(),note});
    write(LOG_KEY,rows)
  };

  const enhanceMaterialList=()=>{
    const table=document.querySelector('#content .m8-table table');
    if(table&&!table.dataset.materialColumnsSeparated){
      table.dataset.materialColumnsSeparated='true';
      const firstHeader=table.querySelector('thead th');
      if(firstHeader){
        firstHeader.textContent='材料编号';
        const nameHeader=document.createElement('th');
        nameHeader.textContent='材料名称';
        firstHeader.after(nameHeader)
      }
      table.querySelectorAll('tbody tr').forEach(row=>{
        const first=row.children[0],empty=first?.querySelector('[class*="empty"]');
        if(empty){
          const colspan=Number(first.getAttribute('colspan')||12);
          first.setAttribute('colspan',String(colspan+1));
          return
        }
        const name=first?.querySelector('b')?.textContent.trim()||'',code=first?.querySelector('span')?.textContent.trim()||'—';
        if(!first)return;
        first.className='project-cell';
        first.innerHTML=`<b>${esc(code)}</b>`;
        const nameCell=document.createElement('td');
        nameCell.className='project-cell';
        nameCell.innerHTML=`<b>${esc(name)}</b>`;
        first.after(nameCell)
      })
    }
    document.querySelectorAll('[data-m8-quote]:disabled').forEach(button=>button.remove());
    document.querySelectorAll('#m8MaterialForm [name="code"]').forEach(control=>{
      control.setAttribute('aria-required','true');
      const label=control.closest('.field')?.querySelector('label');
      if(label){label.classList.add('required');label.dataset.required='true'}
    })
  };

  const captureMaterialFormContext=event=>{
    const edit=event.target.closest('[data-m8-edit]'),add=event.target.closest('[data-m8-add]');
    if(edit)pendingMaterialEditId=edit.dataset.m8Edit||'';
    if(add)pendingMaterialEditId='';
    queueMicrotask(()=>{
      const form=document.getElementById('m8MaterialForm');
      if(form)form.dataset.materialEditId=pendingMaterialEditId
    })
  };

  document.addEventListener('click',captureMaterialFormContext,true);

  document.addEventListener('submit',async event=>{
    const form=event.target;
    if(!(form instanceof HTMLFormElement)||form.id!=='m8MaterialForm')return;
    event.preventDefault();
    event.stopImmediatePropagation();
    const data=new FormData(form),materials=read(MATERIAL_KEY),editId=form.dataset.materialEditId||pendingMaterialEditId;
    const old=materials.find(row=>row.id===editId);
    const selectedUnit=String(data.get('unit')||''),unit=selectedUnit==='其他'?String(data.get('customUnit')||'').trim():selectedUnit;
    const values={
      code:String(data.get('code')||'').trim(),
      name:String(data.get('name')||'').trim(),
      category:String(data.get('category')||'').trim(),
      type:String(data.get('type')||'').trim(),
      brand:String(data.get('brand')||'').trim(),
      specification:String(data.get('specification')||'').trim(),
      material:String(data.get('material')||'').trim(),
      unit,
      technicalParameters:String(data.get('technicalParameters')||'').trim(),
      applicableScenario:String(data.get('applicableScenario')||'').trim(),
      remark:String(data.get('remark')||'').trim()
    };
    if(!values.code||!values.name||!values.category||!values.type||!values.specification||!values.material||!values.unit)return toast('请完整填写材料编号及其他必填信息',true);
    if(materials.some(row=>row.id!==editId&&String(row.code||'').trim().toLowerCase()===values.code.toLowerCase()))return toast('材料编号已存在，请使用其他编号',true);
    const selectedImage=form.querySelector('[name="image"]')?.files?.[0],image=selectedImage?{name:selectedImage.name,size:selectedImage.size,type:selectedImage.type}:old?.image||null;
    if(old&&old.unit!==values.unit&&window.educationConfirm){
      const confirmed=await window.educationConfirm({title:'确认修改计价单位',message:'确认要修改计价单位么？',description:'修改后不会自动换算已有报价单位。',confirmText:'确认修改',danger:false});
      if(!confirmed)return
    }
    if(old){
      Object.assign(old,values,{image,updatedAt:now()});
      addLog(old.id,'编辑材料',old.name,'更新材料基础信息')
    }else{
      const item={...values,id:'material_'+Date.now(),image,status:'ENABLED',createdAt:now(),updatedAt:now()};
      materials.unshift(item);
      addLog(item.id,'新增材料',item.name,'新增材料基础信息')
    }
    write(MATERIAL_KEY,materials);
    modalRoot.innerHTML='';
    pendingMaterialEditId='';
    toast(old?'材料信息已更新':'材料新增成功');
    refreshMaterialList()
  },true);

  document.addEventListener('click',event=>{
    const button=event.target.closest('[data-material-detail-page],[data-m8-view]');
    if(!button)return;
    const id=button.dataset.materialDetailPage||button.dataset.m8View;
    if(!id)return;
    event.preventDefault();
    event.stopImmediatePropagation();
    if(typeof window.showMaterialDetailPage==='function')window.showMaterialDetailPage(id);
    else toast('材料详情加载失败，请刷新页面后重试',true)
  });

  let queued=false;
  new MutationObserver(()=>{
    if(queued)return;
    queued=true;
    queueMicrotask(()=>{queued=false;enhanceMaterialList()})
  }).observe(document.body,{childList:true,subtree:true});
  enhanceMaterialList();
})();
</script>
<script>
(()=>{
  const splitSpecs={
    '项目名称 / 编号':{headers:['项目名称','项目编号'],kind:'name-id'},
    '项目编号 / 名称':{headers:['项目编号','项目名称'],kind:'id-name'},
    '项目编号 / 项目名称':{headers:['项目编号','项目名称'],kind:'id-name'},
    '采购包编号 / 名称':{headers:['采购包编号','采购包名称'],kind:'id-name'},
    '材料编号 / 名称':{headers:['材料编号','材料名称'],kind:'id-name'},
    '验收编号 / 轮次':{headers:['验收编号','验收轮次'],kind:'id-round'},
    '项目 / 合同':{headers:['项目名称','合同名称'],kind:'project-contract'},
    '提交 / 归档时间':{headers:['提交时间','归档时间'],kind:'submit-archive'}
  };
  const clean=value=>String(value||'').replace(/\s+/g,' ').trim();
  const textCell=(tag,text,source)=>{
    const cell=document.createElement(tag);
    if(source?.className)cell.className=source.className;
    cell.textContent=clean(text)||'—';
    return cell
  };
  const splitCell=(row,index,spec)=>{
    const cell=row.cells[index];
    if(!cell)return;
    if(cell.colSpan>1){
      cell.colSpan+=1;
      return
    }
    let first='—',second='—';
    const bold=cell.querySelector('b,strong');
    const span=[...cell.querySelectorAll('span')].find(node=>clean(node.textContent));
    if(spec.kind==='name-id'){
      first=bold?.textContent||cell.childNodes[0]?.textContent||cell.textContent;
      second=span?.textContent||'—'
    }else if(spec.kind==='id-name'){
      first=span?.textContent||cell.childNodes[0]?.textContent||'—';
      second=bold?.textContent||cell.textContent
    }else if(spec.kind==='id-round'){
      first=bold?.textContent||cell.childNodes[0]?.textContent||cell.textContent;
      second=span?.textContent||'—'
    }else if(spec.kind==='project-contract'){
      const projectButton=cell.querySelector('button,a');
      const contractNode=[...cell.querySelectorAll('span')].find(node=>clean(node.textContent));
      const projectCell=document.createElement('td');
      const contractCell=document.createElement('td');
      if(projectButton)projectCell.append(projectButton);
      else projectCell.textContent=clean(cell.childNodes[0]?.textContent)||'—';
      contractCell.textContent=clean(contractNode?.textContent)||'—';
      cell.replaceWith(projectCell);
      projectCell.after(contractCell);
      return
    }else if(spec.kind==='submit-archive'){
      const value=clean(cell.textContent)||'—';
      const archived=[...row.cells].some(td=>/已归档/.test(td.textContent||''));
      first=archived?'—':value;
      second=archived?value:'—'
    }
    const firstCell=textCell('td',first,cell);
    const secondCell=textCell('td',second);
    cell.replaceWith(firstCell);
    firstCell.after(secondCell)
  };
  const splitStackedCell=(row,index,config)=>{
    const cell=row.cells[index];
    if(!cell)return;
    if(cell.colSpan>1){
      cell.colSpan+=1;
      return
    }
    const bold=cell.querySelector('b,strong');
    const span=[...cell.querySelectorAll('span')].find(node=>clean(node.textContent));
    if(!bold||!span)return;
    const primary=clean(bold.textContent);
    const secondary=clean(span.textContent);
    const firstCell=textCell('td',config.primaryFirst?primary:secondary,cell);
    const secondCell=textCell('td',config.primaryFirst?secondary:primary);
    cell.replaceWith(firstCell);
    firstCell.after(secondCell)
  };
  const normalizeStackedColumns=table=>{
    const headerRow=table.tHead?.rows?.[0];
    const bodyRows=[...(table.tBodies?.[0]?.rows||[])];
    if(!headerRow||!bodyRows.length)return false;
    const configs=[
      {header:'项目名称',other:'项目编号',primaryFirst:false,firstHeader:'项目编号',secondHeader:'项目名称'},
      {header:'采购包名称',other:'采购包编号',primaryFirst:false,firstHeader:'采购包编号',secondHeader:'采购包名称'},
      {header:'合同名称',other:'合同编号',primaryFirst:false,firstHeader:'合同编号',secondHeader:'合同名称'},
      {header:'付款申请',other:'付款申请名称',primaryFirst:true,firstHeader:'付款申请编号',secondHeader:'付款申请名称'},
      {header:'发票号码',other:'发票代码',primaryFirst:true,firstHeader:'发票号码',secondHeader:'发票代码'}
    ];
    let changed=false;
    configs.forEach(config=>{
      const headers=[...headerRow.cells];
      if(headers.some(th=>clean(th.textContent)===config.other))return;
      const th=headers.find(node=>clean(node.textContent)===config.header);
      if(!th)return;
      const index=[...headerRow.cells].indexOf(th);
      const sample=bodyRows.map(row=>row.cells[index]).find(cell=>cell?.querySelector('b,strong')&&cell?.querySelector('span'));
      if(!sample)return;
      th.textContent=config.firstHeader;
      const next=document.createElement('th');
      next.textContent=config.secondHeader;
      th.after(next);
      bodyRows.forEach(row=>splitStackedCell(row,index,config));
      changed=true
    });
    return changed
  };
  const normalizeMergedListColumns=()=>{
    document.querySelectorAll('table').forEach(table=>{
      if(table.dataset.splitListColumns==='1')return;
      const headerRow=table.tHead?.rows?.[0];
      if(!headerRow)return;
      let changed=false;
      [...headerRow.cells].forEach(th=>{
        const spec=splitSpecs[clean(th.textContent)];
        if(!spec)return;
        const index=[...headerRow.cells].indexOf(th);
        th.textContent=spec.headers[0];
        const next=document.createElement('th');
        next.textContent=spec.headers[1];
        th.after(next);
        [...(table.tBodies?.[0]?.rows||[])].forEach(row=>splitCell(row,index,spec));
        changed=true
      });
      if(normalizeStackedColumns(table))changed=true;
      table.dataset.splitListColumns='1';
      if(changed)table.style.minWidth=Math.max(900,table.querySelectorAll('th').length*118)+'px'
    })
  };
  let splitColumnsQueued=false;
  new MutationObserver(()=>{
    if(splitColumnsQueued)return;
    splitColumnsQueued=true;
    queueMicrotask(()=>{splitColumnsQueued=false;normalizeMergedListColumns()})
  }).observe(document.body,{childList:true,subtree:true});
  normalizeMergedListColumns()
})();
</script>

<script>
/* 材料价格库详情页最终兼容层：使用独立事件标识，避免历史脚本重复绑定导致点击失效 */
(function(){
  const MATERIAL_KEY='project_materials';
  const QUOTE_KEY='project_material_quotes';
  const read=(key)=>{
    try{
      const value=JSON.parse(localStorage.getItem(key)||'[]');
      return Array.isArray(value)?value:[];
    }catch(error){
      return [];
    }
  };
  const esc=(value)=>String(value??'—').replace(/[&<>"']/g,(char)=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  })[char]);
  const money=(value)=>{
    const amount=Number(value);
    return Number.isFinite(amount)?`¥${amount.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2})}`:'—';
  };
  const latestQuotes=(materialId)=>{
    const quotes=read(QUOTE_KEY)
      .filter((item)=>String(item.materialId)===String(materialId)&&item.status!=='VOIDED')
      .sort((a,b)=>String(b.quoteDate||b.createdAt||'').localeCompare(String(a.quoteDate||a.createdAt||'')));
    const suppliers=new Set();
    return quotes.filter((item)=>{
      const supplier=String(item.supplierName||'未填写供应商');
      if(suppliers.has(supplier)) return false;
      suppliers.add(supplier);
      return true;
    });
  };
  const field=(label,value,full=false)=>`<div class="material-detail-field${full?' full':''}"><label>${esc(label)}</label><span>${esc(value)}</span></div>`;

  function openMaterialQueryDetail(materialId){
    const material=read(MATERIAL_KEY).find((item)=>String(item.id)===String(materialId));

    const quotes=latestQuotes(material.id);

  }

  function normalizeMaterialQuery(){
    const query=document.getElementById('m8Query');
    if(!query)return;
    query.querySelector('.modal-head .close')?.remove();
    query.querySelector('.modal-head small')?.remove();
    query.querySelector('.m8-query-note')?.remove();
    query.querySelectorAll('th').forEach((heading)=>{
      if(heading.textContent.trim()==='当前报价'||heading.textContent.trim()==='最新参考价'){
        heading.textContent='最新报价';
      }
    });
    const head=query.querySelector('.modal-head');
    if(head&&!head.querySelector('[data-material-purchase-back]')){
      const back=document.createElement('button');
      back.type='button';
      back.className='btn link';
      back.setAttribute('data-material-purchase-back','');
      back.textContent='‹ 返回';
      back.onclick=(event)=>{
        event.preventDefault();
        event.stopPropagation();
        const modalRoot=document.getElementById('modalRoot');
        if(modalRoot)modalRoot.innerHTML=window.__materialPurchaseModalHtml||'';
      };
      head.prepend(back);
    }
  }

  function openMaterialDetail(materialId){
    const material=read(MATERIAL_KEY).find((item)=>String(item.id)===String(materialId));
    const contentRoot=document.getElementById('content');
    if(!material){
      if(typeof window.showToast==='function') window.showToast('未找到该材料，请刷新页面后重试','error');
      return;
    }
    if(!contentRoot) return;
    const quotes=latestQuotes(material.id);
    document.querySelectorAll('.nav-btn').forEach((button)=>button.classList.remove('active'));
    contentRoot.innerHTML=`
      <section class="material-detail-page">
        <div class="page-head">
          <div>
            <h1>材料详情</h1>
            <div class="m8-subtle">查看材料完整档案及最新报价</div>
          </div>
          <div class="head-actions">
            <button type="button" class="btn" data-material-detail-back><i class="ri-arrow-left-line"></i>返回材料价格库</button>
            ${material.status!=='ENABLED'?'':`<button type="button" class="btn primary" data-m8-quote="${esc(material.id)}"><i class="ri-add-line"></i>新增报价</button>`}
          </div>
        </div>
        <div class="card material-detail-card">
          <div class="card-head"><h2>材料基础信息</h2><span class="tag ${material.status==='ENABLED'?'green':'gray'}">${material.status==='ENABLED'?'启用':'停用'}</span></div>
          <div class="material-detail-grid">
            ${field('材料编号',material.code)}
            ${field('材料名称',material.name)}
            ${field('材料分类',material.category)}
            ${field('材料类型',material.type)}
            ${field('品牌',material.brand)}
            ${field('材质',material.material)}
            ${field('规格型号',material.specification)}
            ${field('计价单位',material.unit)}
            ${field('使用状态',material.status==='ENABLED'?'启用':'停用')}
            ${field('参考图片',material.image&&material.image.name?material.image.name:'未上传')}
            ${field('创建时间',material.createdAt)}
            ${field('更新时间',material.updatedAt)}
            ${field('技术参数',material.technicalParameters||'—',true)}
            ${field('适用场景',material.applicableScenario||'—',true)}
            ${field('备注',material.remark||'—',true)}
          </div>
        </div>
        <div class="card material-current-quotes">
          <div class="card-head"><h2>最新报价</h2></div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>供应商名称</th><th>材料单价</th><th>计价单位</th><th>是否含税</th><th>报价地区</th><th>报价日期</th><th>有效期</th><th>操作</th></tr></thead>
              <tbody>
                ${quotes.length?quotes.map((quote)=>`
                  <tr>
                    <td><b>${esc(quote.supplierName)}</b></td>
                    <td class="m8-price">${money(quote.unitPrice)}</td>
                    <td>${esc(quote.unit||material.unit)}</td>
                    <td>${quote.taxIncluded?'含税':'不含税'}</td>
                    <td>${esc(quote.region||'—')}</td>
                    <td>${esc(quote.quoteDate)}</td>
                    <td>${esc(quote.validFrom||'—')} 至 ${esc(quote.validTo||'—')}</td>
                    <td><button type="button" class="link-btn" data-material-quote-readonly="${esc(quote.id)}">查看</button></td>
                  </tr>`).join(''):`<tr><td colspan="8"><div class="m8-empty">暂无最新报价</div></td></tr>`}
              </tbody>
            </table>
          </div>
        </div>
      </section>`;
    window.scrollTo({top:0,behavior:'smooth'});
  }

  function normalizeDetailButtons(root=document){
    root.querySelectorAll('[data-m8-view],[data-material-detail-page],[data-material-open-detail]').forEach((button)=>{
      const id=button.getAttribute('data-material-open-detail')
        ||button.getAttribute('data-material-detail-page')
        ||button.getAttribute('data-m8-view');
      if(!id) return;
      button.removeAttribute('data-m8-view');
      button.removeAttribute('data-material-detail-page');
      button.setAttribute('data-material-open-detail',id);
      button.textContent='查看详情';
      button.onclick=(event)=>{
        event.preventDefault();
        event.stopPropagation();
        if(button.closest('#m8Query')) openMaterialQueryDetail(id);
        else openMaterialDetail(id);
      };
    });
  }

  function cleanLegacyMaterialDetail(root=document){
    root.querySelectorAll('.m8-ref-panel span').forEach((label)=>{
      if(label.textContent.includes('不离开当前审批业务即可查询材料历史价格')) label.remove();
    });
    root.querySelectorAll('.material-detail-page [data-m8-edit]').forEach((button)=>button.remove());
    root.querySelectorAll('.material-current-quotes .card-head h2').forEach((heading)=>{
      if(heading.textContent.trim()==='当前报价') heading.textContent='最新报价';
    });
    root.querySelectorAll('.material-current-quotes .card-head > span').forEach((label)=>{
      if(label.textContent.trim()==='按供应商显示最新一条未作废报价') label.remove();
    });
    root.querySelectorAll('.material-current-quotes .m8-empty').forEach((empty)=>{
      empty.textContent=empty.textContent.replace('暂无当前报价','暂无最新报价');
    });
    root.querySelectorAll('.material-detail-page .material-detail-field,.material-readonly-modal .material-readonly-item').forEach((item)=>{
      const label=item.querySelector('label')?.textContent.trim();
      if(label==='材料ID'||label==='报价ID') item.remove();
    });
  }

  window.openMaterialDetailPage=openMaterialDetail;
  window.addEventListener('click',(event)=>{
    if(event.target.closest('[data-material-purchase-back]')){
      event.preventDefault();
      event.stopImmediatePropagation();
      const modalRoot=document.getElementById('modalRoot');
      if(modalRoot)modalRoot.innerHTML=window.__materialPurchaseModalHtml||'';
      return;
    }
    if(!event.target.closest('[data-m8-query]'))return;
    const modalRoot=document.getElementById('modalRoot');
    window.__materialPurchaseModalHtml=modalRoot?.innerHTML||'';
    setTimeout(normalizeMaterialQuery,0);
  },true);
  normalizeDetailButtons();
  normalizeMaterialQuery();
  cleanLegacyMaterialDetail();
  new MutationObserver((records)=>{
    records.forEach((record)=>record.addedNodes.forEach((node)=>{
      if(node.nodeType===1){
        normalizeDetailButtons(node);
        normalizeMaterialQuery();
        cleanLegacyMaterialDetail(node);
      }
    }));
  }).observe(document.body,{childList:true,subtree:true});

  document.addEventListener('click',(event)=>{
    const detailButton=event.target.closest('[data-material-open-detail]');
    if(detailButton){
      event.preventDefault();
      event.stopImmediatePropagation();
      const materialId=detailButton.getAttribute('data-material-open-detail');
      const modalTitle=detailButton.closest('.modal')?.querySelector('.modal-head h2')?.textContent.trim()||'';

      else openMaterialDetail(materialId);
      return;
    }
    const queryBackButton=event.target.closest('[data-material-query-back]');
    if(queryBackButton){
      event.preventDefault();
      event.stopImmediatePropagation();
      const modalRoot=document.getElementById('modalRoot');
      if(modalRoot)modalRoot.innerHTML=window.__materialQueryModalHtml||'';
      return;
    }
    const backButton=event.target.closest('[data-material-detail-back]');
    if(backButton){
      event.preventDefault();
      event.stopImmediatePropagation();
      const navButton=document.querySelector('.nav-btn[data-m8-nav]');
      if(navButton) navButton.click();
    }
  },true);
})();
</script>

<script>
/* 最终界面与交互守卫：仅处理展示层，不修改各模块的业务状态机。 */
(()=>{
  const root=()=>document.getElementById('content');
  const modalRoot=()=>document.getElementById('modalRoot');
  const compactText=value=>String(value||'').replace(/\s+/g,'').trim();
  const closeModal=()=>{const target=modalRoot();if(target)target.innerHTML=''};

  const removeCurrentNodeColumns=scope=>{
    (scope||document).querySelectorAll('table').forEach(table=>{
      const header=table.tHead?.rows?.[0];
      if(!header)return;
      [...header.cells].forEach((cell,index)=>{
        if(compactText(cell.textContent)!=='当前节点')return;
        cell.remove();
        [...(table.tBodies?.[0]?.rows||[])].forEach(row=>{
          const target=row.cells[index];
          if(target)target.remove();
        });
      });
    });
    (scope||document).querySelectorAll('.detail-item,.material-detail-field,.material-readonly-item,.p4-detail-item,.p5-relation,.field').forEach(item=>{
      const label=item.querySelector(':scope > label');
      if(label&&compactText(label.textContent)==='当前节点')item.remove();
    });
    (scope||document).querySelectorAll('.modal-head small,.page-head small,.page-head .sub,.page-head .page-subtitle').forEach(node=>{
      if(/当前节点/.test(node.textContent||''))node.remove();
    });
  };

  const cleanupNavigation=scope=>{
    (scope||document).querySelectorAll('.nav-btn,[data-p4-page],[data-go]').forEach(button=>{
      const text=compactText(button.textContent);
      if(text==='审批设置'||text==='流程配置')button.remove();
    });
  };

  const cleanupPageHints=scope=>{
    (scope||document).querySelectorAll('.page-head > div:first-child > small,.page-head > div:first-child > .sub,.page-head > div:first-child > .page-subtitle').forEach(node=>node.remove());
  };

  const polish=scope=>{
    removeCurrentNodeColumns(scope);
    cleanupNavigation(scope);
    cleanupPageHints(scope);
  };

  document.addEventListener('click',event=>{
    const close=event.target.closest('[data-p4-close],[data-p5-close],[data-unified-close],.modal-head .close,.modal-foot [data-close-modal]');
    if(close){event.preventDefault();event.stopImmediatePropagation();closeModal();return}
    const modalButton=event.target.closest('#modalRoot button');
    if(modalButton&&/^(取消|关闭)$/.test(compactText(modalButton.textContent))){
      event.preventDefault();event.stopImmediatePropagation();closeModal();
    }
  },true);

  let queued=false;
  const observeTarget=document.body;
  if(observeTarget)new MutationObserver(records=>{
    if(queued)return;
    if(records.every(record=>[...record.addedNodes,...record.removedNodes].every(node=>node.nodeType===3)))return;
    queued=true;
    requestAnimationFrame(()=>{queued=false;polish(document)});
  }).observe(observeTarget,{childList:true,subtree:true});
  polish(document);
})();
</script>

      <h3>7. 数据口径与埋点需求</h3><p>主数据存储键为 <code>edu-project-phase2-demo-v2</code>，当前界面读取 <code>${esc(storage)}</code>。交互原型不接入正式埋点；验收记录当前界面的进入、筛选、查看和实际展示的业务按钮是否产生预期反馈。</p>
      <h3>8. 风险、依赖与限制</h3><p>依赖同一浏览器 localStorage 和预置演示数据。当前 PRD 根据打开时的页面或弹窗生成；业务状态变化后重新打开 PRD，以最新可见字段和按钮为准。</p>
      <h3>9. 验收标准</h3><ul><li>PRD 仅出现当前“${esc(pageTitle)}”${isModal?'弹窗':'页面'}实际存在的字段、筛选项、表头和操作。</li><li>不出现同模块其他页面、其他弹窗或当前界面不存在的审批状态。</li><li>当前界面每个可用按钮均产生明确交互结果，禁用按钮显示原因。</li><li>刷新后已保存数据仍可读取，页面不调用真实后端、数据库或文件服务器。</li></ul>

  }
  function dot(type,key,title,isModal){

    b.onclick=e=>{e.preventDefault();e.stopImmediatePropagation();const contextRoot=isModal?b.closest('.modal,.system-confirm'):$('#content');openDoc(type,key,title,isModal,contextRoot)};return b;

  function normalizeCopy(){

    const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);let n;

    modal().innerHTML=`<div class="modal-mask"><div class="modal m8-modal-wide"><div class="modal-head"><div><h2>材料详情</h2></div><button type="button" class="close" data-m8-material-return>×</button></div><div class="modal-body"><div class="form-title">报价列表</div><div class="table-wrap"><table><thead><tr><th>供应商</th><th>报价单价</th><th>报价日期</th><th>有效期</th><th>报价状态</th></tr></thead><tbody>${quotes.length?quotes.map(q=>`<tr><td>${q.supplierName||'—'}</td><td>${Number(q.unitPrice||0).toFixed(2)} 元/${q.unit||material.unit||'—'}</td><td>${q.quoteDate||'—'}</td><td>${q.validFrom||'—'} 至 ${q.validTo||'—'}</td><td>${q.status==='VOIDED'?'已作废':q.status==='EXPIRED'?'已过期':'有效'}</td></tr>`).join(''):'<tr><td colspan="5"><div class="empty">暂无报价记录</div></td></tr>'}</tbody></table></div></div><div class="modal-foot"><button type="button" class="btn primary" data-m8-material-return>返回材料价格查询</button></div></div></div>`;
  },true);
  new MutationObserver(()=>requestAnimationFrame(tidy)).observe(document.body,{childList:true,subtree:true});tidy();
})();
</script>
<script>
(()=>{
  const refine=()=>{
    const modal=document.querySelector('#m8Query');
    if(!modal)return;
    modal.querySelectorAll('th').forEach(th=>{if(th.textContent.trim()==='当前报价'||th.textContent.trim()==='最新参考价')th.textContent='最新报价'});
    const back=modal.querySelector('[data-m8-query-return]');
    const head=modal.querySelector('.modal-head');
    if(back&&head&&!head.querySelector('.m8-query-back')){
      back.classList.add('m8-query-back');
      back.textContent='‹ 返回';
      head.prepend(back);
    }
  };
  new MutationObserver(()=>requestAnimationFrame(refine)).observe(document.body,{childList:true,subtree:true});
  refine();
})();
</script>
